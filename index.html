<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>La Fructosa</title>
  <meta name="description" content="Finanzas personales de la familia en USD, Bs., USDT y EUR. Privadas para cada quien." />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0E1422" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="./icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

  <!-- iOS: pantalla completa al instalar desde Safari > Compartir > Agregar a inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="La Fructosa" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <!-- Estilos propios (sin Tailwind CDN): carga instantánea y funciona sin conexión -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- Librerías como módulos ES con versión fija (sin build step) -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "htm": "https://esm.sh/htm@3.1.1",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
      }
    }
  </script>
  <link rel="modulepreload" href="./js/app.js" />
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <style>
    .splash { min-height: 100dvh; display: grid; place-items: center; }
    .splash img { width: 84px; height: 84px; border-radius: 24px; animation: breathe 1.4s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(.92); opacity: .7; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="splash"><img src="./icons/icon-192.png" alt="La Fructosa" /></div>
  </div>
  <noscript><p style="padding:24px;text-align:center">La Fructosa necesita JavaScript.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
