<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>La Fructosa</title>
  <meta name="description" content="Finanzas personales en USD, VES y USDT." />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#A0C4FF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#152033" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="./icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

  <!-- iOS: pantalla completa al instalar desde Safari > Compartir > Agregar a inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="La Fructosa" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="./styles.css" />
  <!-- Estilos: Tailwind por CDN (sin build step) -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            azul: {
              DEFAULT: '#A0C4FF',
              50: '#F4F8FF',
              100: '#D6E8FF',
              200: '#BEE3F8',
              300: '#A0C4FF',
              400: '#7AABF5',
              500: '#5B8FD4',
              600: '#3D6BB3',
              700: '#2C528A',
              800: '#1E3A5F',
              900: '#152033',
            },
            sol: {
              DEFAULT: '#FDFFB6',
              50: '#FFFEF2',
              100: '#FEFCBF',
              200: '#FDFFB6',
              300: '#F5F08A',
              600: '#8A7E1F',
              700: '#5C5414',
              800: '#3D3810',
              900: '#2E2B0E',
            },
            salmon: {
              DEFAULT: '#FFADAD',
              50: '#FFF4F1',
              100: '#FFD6A5',
              200: '#FFADAD',
              300: '#FF8A8A',
              600: '#D15C5C',
              700: '#B04343',
              800: '#7A2E2E',
              900: '#4A1F1F',
            },
            papel: { DEFAULT: '#F7FAFF' },
          },
          fontFamily: { sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    html, body { background: #F4F8FF; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { html, body { background: #152033; } }
    body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    .safe-top    { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 0.5rem); }
    .tabular     { font-variant-numeric: tabular-nums; }
    .sheet { max-height: min(88vh, 760px); overflow-y: auto; }
  </style>

  <!-- Dependencias como módulos ES, versiones fijas -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "htm": "https://esm.sh/htm@3.1.1",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
      }
    }
  </script>
</head>
<body class="min-h-screen text-azul-900 dark:text-papel antialiased">
  <div id="root">
    <!-- Splash mientras cargan los módulos -->
    <div class="min-h-screen grid place-items-center">
      <img src="./icons/icon-192.png" alt="" class="w-20 h-20 rounded-2xl animate-pulse" />
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
