/* =====================================================================
   La Fructosa · El libro (manual.html)
   Papel crema, tapa de tela azul con azulejos de la casa y hojas que se doblan.
   ===================================================================== */
:root {
  --desk: #0E1422;
  --desk-2: #1A2540;
  --bar: rgba(14, 20, 34, 0.78);
  --bar-text: #F5F8FF;
  --bar-muted: #9AABCB;
  --line: rgba(160, 196, 255, 0.16);

  --paper: #FBF8F1;
  --paper-2: #F3EDE0;
  --ink: #2B2A33;
  --ink-2: #5B5866;
  --navy: #24497C;
  --navy-2: #2F5E9E;
  --cloth: #1D3762;
  --gold: #F2D48A;
  --salmon: #EFA090;
  --yellow: #F7DE95;
  --blue: #AFCDEE;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, Cambria, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --desk: #E4E9F2;
  --desk-2: #F4F6FA;
  --bar: rgba(248, 250, 253, 0.82);
  --bar-text: #17213A;
  --bar-muted: #5B6B88;
  --line: rgba(23, 33, 58, 0.12);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 35%, var(--desk-2), var(--desk) 70%);
  color: var(--bar-text);
  font: 15px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  overscroll-behavior: none;
  height: 100dvh;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { opacity: .35; cursor: default; }
a { color: inherit; }
:focus-visible { outline: 2px solid #A0C4FF; outline-offset: 2px; border-radius: 8px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Barras ---------- */
.lb-top, .lb-bottom {
  position: relative; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: var(--bar);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.lb-top { padding-top: calc(8px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); }
.lb-bottom { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.lb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; height: 40px; border-radius: 12px; padding: 0 8px; color: var(--bar-text); }
.lb-btn:hover:not(:disabled) { background: var(--line); }
.lb-home { text-decoration: none; padding-left: 2px; }
.lb-home img { border-radius: 8px; }
.lb-home span { font-weight: 700; letter-spacing: -.01em; }
.lb-home svg { width: 18px; height: 18px; color: var(--bar-muted); }
.lb-where { flex: 1; min-width: 0; margin: 0; text-align: center; color: var(--bar-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-tools { display: flex; gap: 2px; }
#lb-text b { font-family: var(--serif); font-size: 17px; }
#lb-sound .off { display: none; }
#lb-sound.muted .on { display: none; }
#lb-sound.muted .off { display: inline; }
#lb-sound.muted { color: var(--bar-muted); }
#lb-range { flex: 1; min-width: 60px; accent-color: #A0C4FF; height: 28px; }
.lb-count { min-width: 92px; text-align: center; font-size: 13px; color: var(--bar-muted); font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { .lb-home span { display: none; } .lb-count { min-width: 74px; font-size: 12px; } }
body.no-country .lb-bottom { visibility: hidden; }

/* ---------- Escenario ---------- */
.lb-stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.lb-loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; color: var(--bar-muted); }
.lb-loading img { border-radius: 20px; animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.92); opacity: .7; } }

/* ---------- Libro (motor) ---------- */
.fb { position: relative; touch-action: none; -webkit-touch-callout: none; transition: transform .6s cubic-bezier(.3, .7, .2, 1); }
/* Libro cerrado: se centra la tapa. */
.fb-spread.fb-closed-front { transform: translateX(calc(var(--W) * -0.5)); }
.fb-spread.fb-closed-back { transform: translateX(calc(var(--W) * 0.5)); }
.fb-spine { position: absolute; top: 0; left: 0; width: 0; height: 100%; }
.fb-slot, .fb-front, .fb-back { position: absolute; top: 0; width: var(--W); height: var(--H); }
.fb-slot.fb-r, .fb-front { left: 0; }
.fb-slot.fb-l { left: calc(var(--W) * -1); }
.fb-slot:empty { display: none; }
.fb-slot { z-index: 1; box-shadow: 0 18px 50px rgba(0, 0, 0, .38), 0 3px 10px rgba(0, 0, 0, .22); }
.fb-shade-r { position: absolute; z-index: 2; left: 0; top: 0; width: var(--W); height: var(--H); pointer-events: none; }
.fb-front { z-index: 3; }
.fb-flap { position: absolute; z-index: 4; left: 0; top: 0; width: 0; height: 0; filter: drop-shadow(0 0 9px rgba(0, 0, 0, .3)); pointer-events: none; }
.fb-back { left: 0; transform-origin: 0 0; will-change: transform, clip-path; }
.fb-gloss { position: absolute; left: calc(var(--W) * -1); top: 0; width: calc(var(--W) * 2); height: var(--H); }
.fb-front, .fb-back { will-change: clip-path; }
.fb-backpaper { position: absolute; inset: 0; background: rgba(250, 246, 237, .9); }
.fb-flipping { cursor: grabbing; }
/* Canto de las hojas (más grueso del lado que falta por leer). */
.fb-slot.fb-r::after, .fb-slot.fb-l::after {
  content: ''; position: absolute; top: 4px; bottom: 4px; pointer-events: none; z-index: -1;
  background: repeating-linear-gradient(90deg, #F4EFE3 0 1px, #D9D1C0 1px 2px);
}
.fb-slot.fb-r::after { right: calc(var(--rt, 4px) * -1); width: var(--rt, 4px); border-radius: 0 3px 3px 0; }
.fb-slot.fb-l::after { left: calc(var(--lt, 4px) * -1); width: var(--lt, 4px); border-radius: 3px 0 0 3px; }
.fb:not(.fb-spread) .fb-slot.fb-r::after { width: var(--rt, 4px); }

/* ---------- Página ---------- */
.pg {
  position: absolute; inset: 0; width: var(--W); height: var(--H); overflow: hidden;
  background:
    radial-gradient(140% 100% at 50% 0%, rgba(255, 255, 255, .55), transparent 60%),
    repeating-radial-gradient(circle at 30% 20%, rgba(120, 100, 60, .025) 0 1px, transparent 1px 3px),
    var(--paper);
  color: var(--ink);
  font-size: var(--fs, 16px);
}
/* Sombra del lomo: a la izquierda en páginas derechas y en el teléfono; a la derecha en las izquierdas. */
.pg::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: linear-gradient(90deg, rgba(60, 45, 20, .16), rgba(60, 45, 20, .05) 4%, transparent 9%); }
.fb-spread .pg.odd::before, .lb-measure.spread .pg.odd::before { background: linear-gradient(270deg, rgba(60, 45, 20, .16), rgba(60, 45, 20, .05) 4%, transparent 9%); }
.pg-content { display: flex; flex-direction: column; padding: calc(var(--fs) * 1.6) calc(var(--fs) * 1.7) calc(var(--fs) * 1.1) calc(var(--fs) * 1.9); }
.fb-spread .pg-content.odd, .lb-measure.spread .pg-content.odd { padding-left: calc(var(--fs) * 1.7); padding-right: calc(var(--fs) * 1.9); }
.pg-head { display: flex; justify-content: space-between; gap: 12px; font: 600 calc(var(--fs) * .62)/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: #9C8F74; padding-bottom: calc(var(--fs) * .5); border-bottom: 1px solid rgba(156, 143, 116, .28); margin-bottom: calc(var(--fs) * .9); }
.pg-head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pg-head span:first-child { flex-shrink: 0; max-width: 55%; }
.pg-body { flex: 1; min-height: 0; overflow: hidden; font-family: var(--serif); line-height: 1.5; hyphens: auto; -webkit-hyphens: auto; }
.pg-foot { padding-top: calc(var(--fs) * .5); text-align: center; font: 600 calc(var(--fs) * .72)/1 var(--serif); color: #9C8F74; }
.pg-num::before, .pg-num::after { content: '—'; margin: 0 .5em; opacity: .5; font-weight: 400; }

.pg-body > * { margin: 0 0 calc(var(--fs) * .62); }
.pg-body p { text-align: justify; }
.pg-body p.cut { text-align-last: justify; margin-bottom: 0; }
.pg-body h3 { font: 700 calc(var(--fs) * 1.04)/1.3 var(--sans); color: var(--navy); margin-top: calc(var(--fs) * 1); letter-spacing: -.01em; }
.pg-body > h3:first-child, .pg-body > .ch + h3 { margin-top: 0; }

/* Parte */

.cv-frame { position: absolute; inset: calc(var(--fs) * 1.1); border: 1.5px solid rgba(242, 212, 138, .55); border-radius: 6px; box-shadow: inset 0 0 0 4px rgba(242, 212, 138, .14); pointer-events: none; }

.cv-kicker { margin: calc(var(--fs) * 1.3) 0 0; font: 700 calc(var(--fs) * .72)/1 var(--sans); letter-spacing: .32em; text-transform: uppercase; color: var(--gold); opacity: .85; }
.cv-title { margin: calc(var(--fs) * .3) 0 0; font: 700 calc(var(--fs) * 2.9)/1 var(--serif); letter-spacing: -.01em;
  background: linear-gradient(180deg, #FFF3C8 10%, #E9C46A 55%, #B98F35 95%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .35)); }

  font: 700 calc(var(--fs) * .95)/1 var(--sans); color: #17213A; background: linear-gradient(180deg, #FFF0BF, #E9C46A); box-shadow: 0 8px 22px rgba(0, 0, 0, .35); }

/* ---------- Medidor (invisible) ---------- */
.lb-measure { position: fixed; left: -20000px; top: 0; visibility: hidden; pointer-events: none; }
.lb-measure .pg { position: relative; }

/* ---------- Índice rápido, letra y avisos ---------- */

.lb-sheet[hidden] { display: none; }
.lb-sheet-card { width: min(560px, 100%); max-height: 82dvh; display: flex; flex-direction: column; background: var(--desk-2); color: var(--bar-text); border-radius: 22px 22px 0 0; border: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
@media (min-width: 700px) { .lb-sheet { place-items: center; } .lb-sheet-card { border-radius: 22px; } }
.lb-sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 6px 20px; }
.lb-sheet-head h2 { margin: 0; font: 700 20px/1.2 var(--serif); }
.lb-sheet-body { overflow: auto; padding: 4px 10px 16px; display: grid; gap: 2px; }
.sh-part, .sh-ch { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 12px; }
.sh-part { margin-top: 8px; background: var(--line); }
.sh-part span { font: 800 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: #FFADAD; white-space: nowrap; }

.sh-part b, .sh-ch b { flex: 1; font-weight: 600; }
.sh-part i, .sh-ch i { font-style: normal; color: var(--bar-muted); font-variant-numeric: tabular-nums; }
.sh-ch:hover, .sh-part:hover { background: rgba(160, 196, 255, .14); }
.lb-pop { position: fixed; z-index: 30; top: calc(60px + env(safe-area-inset-top, 0px)); right: 12px; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 14px;
  background: var(--desk-2); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0, 0, 0, .35); }
.lb-pop[hidden] { display: none; }
.lb-pop span { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; color: var(--bar-muted); font-size: 13px; }
.lb-pop small { font-family: var(--serif); font-size: 13px; }
.lb-pop b { font-family: var(--serif); font-size: 20px; }
.lb-toast { position: fixed; z-index: 50; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px);
  padding: 10px 14px; border-radius: 14px; background: #F5F8FF; color: #17213A; font-weight: 600; font-size: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); animation: rise .25s ease; }
.lb-toast[hidden] { display: none; }
.lb-toast button { margin-left: 8px; padding: 6px 10px; border-radius: 10px; background: #24497C; color: #fff; font-weight: 700; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translate(var(--tx, 0), 16px); opacity: 0; } }
.lb-toast { --tx: -50%; }

@media (prefers-reduced-motion: reduce) { .cv-hand, .lb-loading img { animation: none; } }

/* ---------- PDF ---------- */
#lb-print { display: none; }
body.printing { display: block; height: auto; overflow: visible; background: #fff; }
body.printing > :not(#lb-print) { display: none !important; }
body.printing #lb-print { display: block; }
#lb-print .pg { position: relative; break-after: page; page-break-after: always; }
#lb-print .cv-change, #lb-print .cv-hint, #lb-print .cv-chips, #lb-print .cv-ask { display: none !important; }
@media print { @page { margin: 0; } html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
.lb-btn[hidden] { display: none; }

as, escribe cuánto llegó y la app calcula la tasa a la que cambiaste.','Transferencia es mover dinero entre TUS cuentas (por ejemplo, de tu checking a tu savings). No es gasto ni ingreso: tu patrimonio no cambia. Elige "Desde" y "Hacia".'),A('Si pagas en bolívares desde una cuenta en dólares o USDT, activa "Pagué en bolívares": escribe los Bs. y la tasa que usaste, y la app te dice el costo real en dólares y cuánto te ahorró o te costó la brecha frente al BCV.',null,null),"¿Te equivocaste? Toca el movimiento en Movimientos para corregirlo o borrarlo."]},{id:"copiloto",emoji:"✨",title:"Copiloto IA (Fructosa): voz, texto y capturas",intro:'Fructosa es tu asistente con inteligencia artificial. Conoce tus cuentas y te ayuda a registrar sin escribir formularios. Ábrela con el botón "Copiloto IA" del inicio.',steps:[A('Texto libre: escribe como hablas, por ejemplo "gasté 12 dólares en el mercado con Zelle" o "me pagaron 300 de sueldo en Banesco".','Texto libre: escribe como hablas, por ejemplo "gasté 12 euros en el súper con Bizum" o "me pagaron 1.500 de nómina en BBVA".','Texto libre: escribe como hablas, por ejemplo "gasté 12 dólares en el súper con Apple Pay" o "me pagaron 2.000 de sueldo en Chase".','Texto libre: escribe como hablas, por ejemplo "gasté 12 dólares en el mercado" o "me pagaron 300 de sueldo en mi banco".'),"Nota de voz: toca el micrófono 🎙️ y dilo en voz alta. Lo que dices se escribe en tiempo real; cuando termines, toca enviar.",A("Captura o foto: toca la cámara 📷 y elige la captura del comprobante (Pago Móvil, transferencia, Zelle, Binance, PayPal, Zinli, una factura o un ticket).","Captura o foto: toca la cámara 📷 y elige la captura del comprobante (Bizum, transferencia de tu banco, Revolut, PayPal, una factura o un ticket).","Captura o foto: toca la cámara 📷 y elige la captura del comprobante (Zelle, Venmo, Cash App, tu banco, una factura o un recibo).","Captura o foto: toca la cámara 📷 y elige la captura del comprobante (transferencia, PayPal, Wise, Binance, una factura o un ticket)."),'Fructosa te muestra el movimiento listo: monto, moneda, fecha, cuenta y categoría. Revísalo y toca "Registrar", o "Descartar" si algo no cuadra.'],tips:['Nada se guarda sin que toques "Registrar".',A('También responde preguntas: "¿cuánto tengo en total?", "¿en qué gasté más este mes?", "calcúlame 400 euros a tasa BCV".','También responde preguntas: "¿cuánto tengo en total?", "¿en qué gasté más este mes?", "¿qué debo saber de la declaración de la renta?".','También responde preguntas: "¿cuánto tengo en total?", "¿en qué gasté más este mes?", "¿qué debo saber de mis taxes?".','También responde preguntas: "¿cuánto tengo en total?", "¿en qué gasté más este mes?".'),A("Si una captura es un cambio de divisa entre tus propias cuentas (vender USDT y recibir bolívares), te pedirá anotarlo como Transferencia con el botón +.","Si una captura es un movimiento entre tus propias cuentas (por ejemplo, comprar USDT desde tu banco), te pedirá anotarlo como Transferencia con el botón +.","Si una captura es un movimiento entre tus propias cuentas (por ejemplo, de checking a savings), te pedirá anotarlo como Transferencia con el botón +."),"Por tu seguridad, Fructosa nunca repite números de cuenta, cédulas ni teléfonos que aparezcan en una imagen. La primera vez te pide permiso para usar la IA; si el navegador pide el micrófono, acepta."]},{id:"conciliacion",emoji:"⚖️",title:"Conciliación semanal: tu saldo igual a la realidad",intro:"Conciliar es comparar el saldo de la app con el de tu banco o tu cartera y corregir la diferencia. Hazlo una vez por semana (por ejemplo, cada domingo) y tu patrimonio siempre será real.",steps:["Abre la app de tu banco (o cuenta el efectivo) y anota el saldo real de cada cuenta.","En La Fructosa entra a Más › Cuentas y toca la cuenta.",A("Si el saldo coincide, listo. Si no, revisa en su lista de movimientos si te faltó anotar algo (una comisión, un Pago Móvil, una compra pequeña) y regístralo.","Si el saldo coincide, listo. Si no, revisa en su lista de movimientos si te faltó anotar algo (una comisión, un Bizum, una compra pequeña) y regístralo.","Si el saldo coincide, listo. Si no, revisa en su lista de movimientos si te faltó anotar algo (un fee, un pago con Zelle o Venmo, una compra pequeña) y regístralo.","Si el saldo coincide, listo. Si no, revisa en su lista de movimientos si te faltó anotar algo (una comisión, una transferencia, una compra pequeña) y regístralo."),'Si aún hay diferencia, toca "Ajustar", escribe el saldo real y confirma. La app registra la diferencia como "Ajuste de saldo".',"Repite con cada cuenta y termina en Análisis para ver cómo va el mes."],tips:["Un ajuste grande o frecuente es una señal: hay gastos que se te escapan. Anótalos al momento la semana siguiente.","Las comisiones bancarias y de cambio cuentan: anótalas como gasto para que el saldo cuadre."]},{id:"exportar",emoji:"📤",title:"Exportación y respaldo: Excel y CSV",intro:"Tus datos son tuyos y puedes llevártelos cuando quieras para tu control local.",steps:['Respaldo completo en Excel: Más › Ajustes › Respaldo › "Descargar todos mis datos (Excel)". Trae resumen, cuentas, movimientos, presupuestos, pagos fijos, metas, préstamos y tasas.',"Movimientos en Excel: en Movimientos filtra lo que quieras (mes, cuenta, categoría) y toca el ícono de descarga ⬇️. En Análisis, el mismo ícono exporta el mes que estás viendo. En Más también puedes exportarlo todo en Excel o en CSV (texto simple).",'En iPhone, cuando aparezca el menú de compartir, toca "Guardar en Archivos" y elige una carpeta (iCloud Drive o En mi iPhone). En computadora se descarga directo.',"Abre el archivo en Excel, Numbers o Google Sheets. Viene listo para leer: encabezados en azul oscuro, ingresos en verde (+), gastos en rojo (−), transferencias en azul, ajustes e inactivos en gris y totales en amarillo. La hoja Resumen trae la guía de colores, y cada tabla tiene filtros."],tips:["Haz tu respaldo cada semana, después de conciliar. Si pasan 7 días sin respaldo, la app te lo recuerda."]}],_e=[{emoji:"💰",title:"Tu resumen en el inicio",body:["Arriba ves cuánto tienes en total, sumando todas tus cuentas en una sola moneda (cámbiala con los botones de la derecha). Debajo, cuánto entró, cuánto salió y qué porcentaje te está quedando este mes.","El ícono del ojo oculta los montos si estás en un lugar público."]},{emoji:"💱",title:"El dólar de hoy: BCV, Paralelo y USDT",only:"rates",body:["Ves el dólar oficial (BCV), el del mercado (Paralelo), el USDT y el Euro BCV. Se actualizan solos varias veces al día; en Tasas también puedes tocar actualizar.","La brecha es cuánto más cuesta el dólar del mercado que el oficial. En Tasas tienes una calculadora para convertir entre dólares, euros y bolívares.","En Tasas › Historial eliges una tasa y ves cómo se movió en el último mes, 3 meses, 6 meses o el año, con su mínimo, su máximo y cuánto subió. Toca la línea para leer el valor de cada día."]},{emoji:"🎯",title:"Presupuestos y pagos fijos",body:["Un presupuesto es el tope mensual de una categoría (por ejemplo, mercado: 200 $). La barra se pone amarilla al 80% y roja al pasarte.","Los pagos fijos son los que se repiten (alquiler, internet, colegio). La app te recuerda cuándo vencen y los registra con un toque."]},{emoji:"🏁",title:"Metas de ahorro y préstamos",body:["En Más › Metas de ahorro creas una meta con su monto y fecha y vas abonando; la app te dice cuánto apartar cada mes.",'En Más › Por cobrar y pagar anotas quién te debe y a quién le debes. Con "Me pagó" o "Pagué" registras abonos.']},{emoji:"📎",title:"Comprobantes",body:['Al registrar o editar un movimiento, toca "Adjuntar foto del recibo o captura" y elige una foto o tómala en el momento. Queda guardada con ese movimiento y solo tú puedes verla.',"Los movimientos con comprobante muestran un 📎. Abre el movimiento y toca la foto para verla en grande. Necesitas conexión para subirla."]},{emoji:"📅",title:"Calendario de gastos",body:["En Movimientos, el botón del calendario muestra el mes por días. Cada día dice cuánto gastaste y se pinta más fuerte cuanto más gastaste; el punto verde indica que ese día entró dinero.","Toca un día para ver solo sus movimientos y sus totales. Tócalo otra vez para volver a todo el mes."]},{emoji:"🛒",title:"Lista de compras",body:["En Más › Lista de compras anotas lo que necesitas, con cantidad y precio si lo sabes. La app te dice el total estimado antes de llegar a la caja.",'Marca cada producto al meterlo en el carrito. Al pagar, "Registrar gasto" abre el formulario con el total de lo marcado. Puedes tener varias listas (mercado, farmacia…).']},{emoji:"🎙️",title:"Dictar un gasto",body:['Toca el micrófono de arriba en Inicio y di el gasto, por ejemplo "gasté 10 en el almuerzo". Fructosa lo prepara y tú solo confirmas.','En Android, mantén presionado el ícono de La Fructosa y elige "Dictar un gasto" para ir directo.']},{emoji:"📊",title:"Análisis del mes",body:[A("En qué se va tu dinero, la comparación con el mes anterior, tu tasa de ahorro y, si usas bolívares, cuánto te ahorró o costó la brecha.","En qué se va tu dinero, la comparación con el mes anterior y tu tasa de ahorro.","En qué se va tu dinero, la comparación con el mes anterior y tu tasa de ahorro.")]},{emoji:"📶",title:"Sin internet también funciona",body:['Sin señal, la app abre con lo último que cargó y puedes seguir anotando. Arriba verás "⏳ movimientos por subir": se suben solos al volver la conexión, sin duplicarse.']},{emoji:"🔔",title:"Avisos en tu teléfono",body:["En Ajustes › Avisos activas recordatorios de pagos fijos, préstamos, respaldo y las tasas de la mañana.",'En iPhone, primero instala la app en tu pantalla de inicio (ver "Instalar en iPhone").']},{emoji:"🔒",title:"Bloqueo con Face ID, huella o PIN",body:['En Ajustes › Privacidad y seguridad activas el bloqueo. Si olvidas el PIN, toca "Olvidé mi PIN" y entras de nuevo con tu contraseña.']},{emoji:"🛡️",title:"Tu privacidad",body:["Cada persona tiene su propia cuenta y nadie más puede ver sus datos: el servidor lo bloquea. La app no se conecta a tu banco ni pide claves bancarias.","En Ajustes › Términos y privacidad lees los términos, y en Ajustes › Borrar mi cuenta eliminas tu cuenta con todos sus datos."]},{emoji:"🌗",title:"Modo claro u oscuro",body:["En Ajustes › Apariencia eliges Oscuro, Claro o Automático."]}],ve={motto:"Lo que no se mide, no se controla ni se mejora.",intro:"La Fructosa funciona como un sistema: registrar, conciliar, revisar y ahorrar. Si sigues estos hábitos durante un mes, vas a saber exactamente a dónde va tu dinero y qué cambiar.",tips:[{emoji:"📏",title:"La regla de oro: mide todo",body:'No puedes mejorar lo que no ves. Anota cada gasto, por pequeño que sea: el café, el estacionamiento, la comisión del banco. Los gastos "hormiga" suelen sumar entre el 10% y el 20% del mes.'},{emoji:"⚡",title:"Registra al momento",body:"Anota el gasto apenas pagues, en los siguientes diez segundos. Con Fructosa basta una nota de voz o la captura del comprobante. No dejes acumular capturas: después de dos días ya no recuerdas la mitad."},{emoji:"⚖️",title:"Concilia cada semana",body:"Elige un día fijo (domingo funciona bien) y compara el saldo de cada cuenta con el real. Quince minutos a la semana mantienen tu patrimonio exacto y te avisan de fugas a tiempo."},{emoji:"🛟",title:"Fondo de emergencia primero",body:A("Antes de invertir o hacer compras grandes, junta entre 3 y 6 meses de tus gastos básicos en una cuenta aparte y en una moneda estable (USD o USDT). Créalo como Meta de ahorro y abónale cada mes.","Antes de invertir o hacer compras grandes, junta entre 3 y 6 meses de tus gastos básicos en una cuenta de ahorro aparte, en euros. Créalo como Meta de ahorro y abónale cada mes.","Antes de invertir o hacer compras grandes, junta entre 3 y 6 meses de tus gastos básicos en una cuenta de ahorro (savings) aparte. Créalo como Meta de ahorro y abónale cada mes.","Antes de invertir o hacer compras grandes, junta entre 3 y 6 meses de tus gastos básicos en una cuenta aparte y en una moneda estable. Créalo como Meta de ahorro y abónale cada mes.")},{emoji:"🏁",title:"Metas de ahorro con fecha",body:"Una meta sin fecha es un deseo. Ponle monto y fecha en Más › Metas de ahorro y la app te dice cuánto apartar cada mes. Págate primero: cuando cobres, aparta el ahorro antes de gastar."},{emoji:"🧮",title:"Reparte con la regla 50/30/20",body:"50% para necesidades (mercado, servicios, alquiler), 30% para gustos y 20% para ahorro y deudas. Ponle un presupuesto a las categorías donde más se te va el dinero."},{emoji:"💱",title:"Cuida la brecha",body:"Si pagas en bolívares con respaldo en divisas, registra la tasa que usaste. La app te muestra cada mes cuánto te ahorró o te costó.",only:"rates"},{emoji:"🇪🇸",title:"España: impuestos sin complicarte",body:"El IVA ya va incluido en lo que pagas. La declaración de la renta (IRPF) se presenta en primavera, normalmente de abril a finales de junio, desde la web o la app de la Agencia Tributaria: guarda tus nóminas y facturas importantes. Si tienes piso, el IBI llega una vez al año: crea un pago fijo o una meta y aparta un poco cada mes. Anota lo que pagues en la categoría Impuestos. Para tu caso concreto, consulta con un gestor.",only:["ES"]},{emoji:"🇺🇸",title:"Estados Unidos: impuestos y crédito, lo básico",body:"El sales tax se suma en la caja: el precio de la etiqueta no es el final. La declaración anual (IRS) se presenta normalmente hasta el 15 de abril: guarda tus W-2 o 1099. Si trabajas por tu cuenta, aparta una parte de cada pago para impuestos. Paga el total de la tarjeta de crédito cada mes: evitas intereses y cuidas tu credit score. Para tu caso concreto, consulta con un contador (CPA).",only:["US"]},{emoji:"📅",title:"Revisa el mes los lunes",body:"Abre Análisis, mira tus tres categorías más altas y compáralas con el mes anterior. Decide un solo ajuste para la semana: es más fácil cumplir uno que diez."}],weekly:["Cada día: registra al momento (voz, captura o +).","Cada domingo: concilia tus cuentas y descarga tu respaldo.","Cada lunes: revisa Análisis y tus presupuestos.","Cada mes: abona a tu fondo de emergencia y a tus metas."]},Y={VE:{title:"Venezuela",text:"Pago Móvil, efectivo en dólares y bolívares, Zelle, Binance (USDT) y tu banco venezolano. Además ves el dólar BCV, el Paralelo y el USDT, y la calculadora de brecha. Categoría extra: Condominio."},US:{title:"Estados Unidos",text:"Todo en dólares: tu banco (Chase, Bank of America, Wells Fargo, Citi, Capital One…), checking y savings, tarjetas de crédito, Zelle, Venmo, Cash App, Apple Pay y PayPal. Categorías extra: Alquiler (renta), Seguros, Impuestos, Propinas y Reembolso de impuestos."},ES:{title:"España",text:"Todo en euros: tu banco (BBVA, Santander, CaixaBank, Sabadell, ING…), la cuenta con IBAN, la tarjeta, el efectivo en euros, Bizum, Revolut y PayPal. Categorías extra: Alquiler, Comunidad, Seguros, Impuestos, Devolución de Hacienda y Ayudas."},INT:{title:"Otro país",text:"Panamá, Colombia, Chile, México, Perú o donde vivas: tu banco local en dólares o euros, Wise, PayPal, Zelle, Binance y, si la tienes, tu cuenta venezolana en bolívares. Categorías extra: Alquiler, Seguros e Impuestos."}},Ee=[`Copia el enlace ${I} y ábrelo en Safari.`,"Toca el botón de Opciones o Compartir (los 3 puntos ••• o el ícono de compartir, abajo a la derecha).",'Selecciona "Compartir" (Share).','Toca "Ver más" (View More) si no aparece a primera vista.','Presiona "Agregar a la pantalla de inicio" (Add to Home Screen) y luego "Agregar".'],Se=[`Abre ${I} en Chrome.`,'Toca "Instalar" en el aviso, o el menú ⋮ › "Instalar app" (o "Agregar a pantalla principal").'],ye=(a,o)=>!a.only||(a.only==="rates"?!!o?.rates:Array.isArray(a.only)&&a.only.includes(o?.code));function Ce(a,o){if(Array.isArray(a))return a.map(e=>Ce(e,o)).filter(e=>e!=null);if(a&&a.__v){let e=o?.code||"VE";return e in a?a[e]:a.VE}return a}function je(a){let o=(e,t)=>({...e,...Object.fromEntries(t.map(r=>[r,Ce(e[r],a)]))});return{CORE:Oe.map(e=>o(e,["intro","steps","tips"])),MORE:_e.filter(e=>ye(e,a)).map(e=>o(e,["body"])),FINANCE_GUIDE:{...ve,tips:ve.tips.filter(e=>ye(e,a)).map(e=>o(e,["body"]))}}}var w=(a,o,e,t=a)=>({__v:!0,VE:a,ES:o,US:e,INT:t}),Q=(a,o)=>({__when:!0,only:a,text:o}),Ge=[{id:"privacidad",emoji:"🛡️",title:"Privacidad y seguridad",items:[{q:"¿Mi familia puede ver mi dinero o mis movimientos?",a:["No. Cada persona entra con su propio usuario y solo ve lo suyo. Cada registro lleva tu identificador y la base de datos (seguridad a nivel de fila) rechaza cualquier consulta de otra persona, aunque sea de la familia y aunque use el mismo teléfono con su propia sesión.","Tampoco el Copiloto IA de otra persona puede ver tus datos: solo recibe los de quien está conectado."]},{q:"¿La app se conecta a mi banco o me pide mis claves bancarias?",a:["No. La Fructosa no se conecta a ningún banco, no mueve dinero y nunca te pide claves bancarias, números de tarjeta ni documentos de identidad. Solo guarda lo que tú anotas."]},{q:"¿Dónde se guardan mis datos?",a:["En Supabase, un servicio profesional de bases de datos. Viajan cifrados (HTTPS) y tu contraseña se guarda cifrada: nadie puede leerla, ni siquiera el administrador.","Las fotos de comprobantes que adjuntes se guardan en un espacio privado de tu cuenta y solo tú puedes verlas."]},{q:"¿Venden mis datos o hay publicidad?",a:["No. La app es gratuita, no tiene publicidad y no vende ni comparte tus datos. Solo intervienen los servicios que la hacen funcionar: Supabase, el servicio donde está alojada la app y, si usas el Copiloto, Google Gemini.",Q("rates","Las tasas se consultan en fuentes públicas sin enviar ningún dato tuyo.")]},{q:"¿Y si alguien agarra mi teléfono?",a:["Activa el bloqueo en Ajustes › Privacidad y seguridad: Face ID, huella o un PIN. Se pide al abrir la app y al volver si estuvo más de un minuto en segundo plano. Después de 5 intentos fallidos hay que esperar 30 segundos.","El PIN no se guarda tal cual, solo una versión cifrada en ese teléfono. Y si estás en un lugar público, toca el ojo del Inicio para ocultar los montos."]},{q:"Olvidé mi PIN, ¿qué hago?",a:['En la pantalla de bloqueo toca "Olvidé mi PIN". Se cierra la sesión, entras de nuevo con tu usuario y contraseña y el bloqueo queda desactivado en ese teléfono. Lo vuelves a crear en Ajustes cuando quieras. Tus datos no se tocan.']}]},{id:"cuenta",emoji:"👤",title:"Tu cuenta y contraseña",items:[{q:"¿Puedo entrar con mi correo en vez del usuario?",a:['Sí. En "Usuario o correo" sirve cualquiera de los dos, junto con tu contraseña.']},{q:"Olvidé mi contraseña",a:['En la pantalla de entrada toca "¿La olvidaste?", escribe el correo con el que te registraste y toca "Enviar enlace". Abre el enlace que te llega y la app te pide la contraseña nueva. Si no ves el correo, revisa la carpeta de spam.']},{q:"¿Cómo cambio mi contraseña?",a:["En Ajustes › Privacidad y seguridad › Cambiar contraseña. Debe tener al menos 8 caracteres."]},{q:"¿Puedo cambiar mi nombre o mi usuario?",a:["Tu nombre sí: en Ajustes toca tu nombre arriba y escríbelo de nuevo. El usuario (@) es fijo, porque es con lo que entras."]},{q:"¿Puedo usarla en varios teléfonos, en el iPad o en la computadora?",a:["Sí. Tus datos viven en tu cuenta, no en el teléfono: entra con tu usuario desde cualquier dispositivo y verás lo mismo. En iPad y en computadora la app muestra un menú lateral a la izquierda.","Lo único que es de cada dispositivo es el bloqueo con PIN o huella y, si la pusiste, tu propia clave de IA."]},{q:"¿Cuánto cuesta?",a:["Nada. La Fructosa es gratuita, sin suscripciones ni compras dentro de la app."]},{q:"¿Cómo borro mi cuenta?",a:["En Ajustes › Borrar mi cuenta. Antes te ofrece descargar tu respaldo y te pide escribir tu usuario para confirmar. Se borran tu cuenta y todos tus datos, incluida la conversación con Fructosa. Es inmediato y no se puede deshacer."]}]},{id:"monedas",emoji:"💵",title:"Cuentas y monedas",items:[{q:"¿Qué monedas puedo usar?",a:[w("Dólares (USD), bolívares (Bs.), USDT y euros (EUR).","Euros (EUR), dólares (USD) y USDT.","Dólares (USD) y USDT.","Dólares (USD), euros (EUR), USDT y, si conservas una cuenta en Venezuela, bolívares (Bs.).")]},{q:"¿Una cuenta puede tener dos monedas?",a:[w('No: cada cuenta tiene una sola moneda. Si tu banco te da una cuenta en bolívares y otra en dólares, crea dos cuentas (por ejemplo, "Banesco Bs." y "Banesco USD").','No: cada cuenta tiene una sola moneda. Si tienes euros y dólares en el mismo banco, crea dos cuentas (por ejemplo, "BBVA EUR" y "BBVA USD").','No: cada cuenta tiene una sola moneda. Si tienes dólares en el banco y USDT en un exchange, son dos cuentas (por ejemplo, "Chase" y "Coinbase USDT").','No: cada cuenta tiene una sola moneda. Si tienes dos monedas en el mismo banco, crea dos cuentas (por ejemplo, "Mi banco USD" y "Mi banco EUR").')]},{q:"¿Cómo se calcula mi patrimonio total?",a:[w("La app convierte el saldo de cada cuenta a tu moneda principal con las tasas del día y los suma. La moneda principal la cambias con los botones del Inicio o en Ajustes › Región y moneda.","La app convierte el saldo de cada cuenta a tu moneda principal (euros o dólares) y los suma. La cambias con los botones del Inicio o en Ajustes › Región y moneda.","La app suma el saldo de todas tus cuentas en dólares.","La app convierte el saldo de cada cuenta a tu moneda principal y los suma. La cambias con los botones del Inicio o en Ajustes › Región y moneda."),Q("rates","En Ajustes también eliges si los dólares se valoran a tasa BCV o Paralelo. Paralelo refleja mejor cuántos dólares reales tendrías si cambiaras todo hoy."),Q("investments",'El valor actual de tus inversiones también suma: debajo del total ves "Cuentas" e "Inversiones" por separado.')]},{q:"¿Cuál es la diferencia entre una transferencia y un gasto?",a:[w("Una transferencia es mover dinero entre TUS cuentas (por ejemplo, de Zelle a Binance o vender USDT y recibir bolívares). No es gasto ni ingreso, así que tu patrimonio no cambia. Si las monedas son distintas, escribes cuánto llegó y la app calcula la tasa a la que cambiaste.","Una transferencia es mover dinero entre TUS cuentas (por ejemplo, de tu banco a Revolut). No es gasto ni ingreso, así que tu patrimonio no cambia. Si las monedas son distintas, escribes cuánto llegó y la app calcula el cambio.","Una transferencia es mover dinero entre TUS cuentas (por ejemplo, de tu checking a tu savings). No es gasto ni ingreso, así que tu patrimonio no cambia.","Una transferencia es mover dinero entre TUS cuentas (por ejemplo, de tu banco a Wise). No es gasto ni ingreso, así que tu patrimonio no cambia. Si las monedas son distintas, escribes cuánto llegó y la app calcula el cambio.")]},{q:"El saldo de la app no coincide con el de mi banco",a:['Entra a la cuenta y revisa si falta algo por anotar (una comisión, un pago pequeño). Si aún hay diferencia, toca "Ajustar" y escribe el saldo real: la app registra la diferencia como "Ajuste de saldo". Hacerlo una vez por semana mantiene todo exacto.']},{q:"¿Puedo borrar una cuenta que ya no uso?",a:['Mejor archívala: entra a la cuenta, toca editar y "Archivar". Desaparece de la lista y del total, pero su historial se conserva. Si te arrepientes, la restauras desde el mismo lugar.']},{q:"Me mudé de país, ¿qué hago?",a:[w("Cambia tu país en Ajustes › Región y moneda. La app se adapta a las monedas, bancos y categorías del nuevo país, y tu moneda principal pasa a la de allá. Tus cuentas y movimientos no cambian.","Cambia tu país en Ajustes › Región y moneda. La app se adapta a las monedas, bancos y categorías del nuevo país. Tus cuentas y movimientos no cambian.","Cambia tu país en Ajustes › Región y moneda. La app se adapta a las monedas, bancos y categorías del nuevo país. Tus cuentas y movimientos no cambian.","Cambia tu país en Ajustes › Región y moneda. La app se adapta a las monedas, bancos y categorías del nuevo país, y tu moneda principal pasa a la de allá. Tus cuentas y movimientos no cambian.")]}]},{id:"tasas",emoji:"💱",title:"Tasas y brecha cambiaria",only:"rates",items:[{q:"¿De dónde salen las tasas?",a:["El dólar BCV, el euro BCV y el dólar Paralelo (promedio Monitor) vienen de DolarApi. El USDT es la mediana de los 10 primeros anuncios de venta en Binance P2P.","Son de referencia: la tasa que te dé un comercio, tu banco o un cambista puede variar un poco."]},{q:"¿Cada cuánto se actualizan?",a:["Solas, cuatro veces al día: 8:00 a. m., 11:00 a. m., 2:00 p. m. y 6:00 p. m., hora de Venezuela. Si abres la app y todavía no hay tasas de hoy, las pide en ese momento. En Tasas también puedes tocar el botón de actualizar."]},{q:"¿Qué es la brecha?",a:["Es cuánto más caro está el dólar del mercado (Paralelo) que el oficial (BCV), en porcentaje. Importa cuando pagas en bolívares teniendo tu dinero en dólares o USDT: según la tasa a la que cambies, ese pago te sale más barato o más caro en dólares reales."]},{q:"Pagué en bolívares desde mi cuenta en dólares, ¿cómo lo anoto?",a:['Al registrar el gasto, elige la cuenta en dólares o USDT y activa "Pagué en bolívares". Escribe los Bs. que pagaste y la tasa que usaste: la app calcula el costo real en tu moneda y te dice cuánto ahorraste o perdiste frente a la tasa BCV. En Análisis ves el total del mes.']},{q:"¿Puedo ver cómo se ha movido el dólar?",a:["Sí. En Tasas › Historial eliges una tasa y ves su evolución en el último mes, 3 meses, 6 meses o el año, con su mínimo, su máximo y cuánto subió. Toca la línea para leer el valor de cada día."]},{q:"Vivo fuera de Venezuela, ¿por qué veo tasas?",only:["INT"],a:["Porque tienes al menos una cuenta activa en bolívares. Si la archivas, las tasas y la calculadora de brecha dejan de aparecer."]}]},{id:"respaldo",emoji:"💾",title:"Respaldo y tus datos",items:[{q:"Si pierdo o cambio de teléfono, ¿pierdo mis datos?",a:["No. Todo está guardado en tu cuenta. Instala la app en el teléfono nuevo, entra con tu usuario y contraseña y aparece todo como lo dejaste."]},{q:"¿Cómo descargo una copia de todo?",a:['En Ajustes › Respaldo › "Descargar todos mis datos (Excel)". Trae resumen, cuentas, movimientos, presupuestos, pagos fijos, metas, préstamos y tasas, con colores y filtros listos para Excel, Numbers o Google Sheets.',Q("investments","También trae una hoja con tus inversiones."),'En iPhone, cuando aparezca el menú de compartir, toca "Guardar en Archivos". Si pasan 7 días sin respaldo, la app te lo recuerda.']},{q:"¿Puedo volver a cargar ese Excel en la app?",a:["No, la app no importa archivos. El Excel es tu copia para consultar, imprimir o guardar en un lugar seguro. Tus datos no dependen de él: ya están guardados en tu cuenta."]},{q:"¿Puedo exportar solo algunos movimientos?",a:["Sí. En Movimientos filtra por mes, cuenta o categoría y toca el ícono de descarga. En Análisis, el mismo ícono exporta el mes que estás viendo. En Más también puedes exportarlo todo en Excel o en CSV (texto simple)."]}]},{id:"ia",emoji:"✨",title:"Copiloto IA (Fructosa)",items:[{q:"¿Qué hace Fructosa?",a:['Es tu asistente con inteligencia artificial. Registra movimientos a partir de lo que escribes, de una nota de voz o de la captura de un comprobante, y responde preguntas sobre tus finanzas, como "¿en qué gasté más este mes?".']},{q:"¿Tengo que pagar o poner alguna clave?",a:["No. El Copiloto ya viene incluido y funciona sin configurar nada. Si prefieres usar tu propia clave de Google Gemini, la pegas en Ajustes › Copiloto IA; se guarda solo en ese dispositivo."]},{q:"¿Qué datos ve la IA?",a:[w("Para responderte, se envía a Google Gemini tu pregunta, las capturas que adjuntes y un resumen de tus cuentas, tasas y últimos movimientos. La primera vez te pide permiso.","Para responderte, se envía a Google Gemini tu pregunta, las capturas que adjuntes y un resumen de tus cuentas y últimos movimientos. La primera vez te pide permiso.","Para responderte, se envía a Google Gemini tu pregunta, las capturas que adjuntes y un resumen de tus cuentas y últimos movimientos. La primera vez te pide permiso.","Para responderte, se envía a Google Gemini tu pregunta, las capturas que adjuntes y un resumen de tus cuentas y últimos movimientos. La primera vez te pide permiso."),w("En la versión gratuita de Gemini, Google puede conservar esas conversaciones para mejorar sus servicios, así que nunca le escribas contraseñas ni claves. Fructosa tampoco repite números de cuenta, cédulas ni teléfonos que aparezcan en una imagen.","En la versión gratuita de Gemini, Google puede conservar esas conversaciones para mejorar sus servicios, así que nunca le escribas contraseñas ni claves. Fructosa tampoco repite números de cuenta, teléfonos ni números de referencia completos que aparezcan en una imagen.","En la versión gratuita de Gemini, Google puede conservar esas conversaciones para mejorar sus servicios, así que nunca le escribas contraseñas ni claves. Fructosa tampoco repite números de cuenta, teléfonos ni números de referencia completos que aparezcan en una imagen.","En la versión gratuita de Gemini, Google puede conservar esas conversaciones para mejorar sus servicios, así que nunca le escribas contraseñas ni claves. Fructosa tampoco repite números de cuenta, teléfonos ni números de referencia completos que aparezcan en una imagen.")]},{q:"¿Puede guardar un movimiento sin que yo lo apruebe?",a:['No. Fructosa te muestra el movimiento listo y nada se guarda hasta que tocas "Registrar". Revisa siempre el monto y la cuenta: la IA se puede equivocar.']},{q:'Me dice "Has hecho demasiadas preguntas seguidas"',a:["Para que la IA incluida alcance para toda la familia, cada persona tiene hasta 50 preguntas cada 10 minutos. Espera unos minutos y vuelve a intentarlo."]},{q:"¿Se guarda mi conversación?",a:['Sí, en tu cuenta, para que la retomes desde cualquier dispositivo. Solo tú la ves. La borras con "Nueva conversación".']},{q:"La nota de voz no funciona",a:['El navegador tiene que tener permiso para usar el micrófono. Cuando lo pida, toca "Permitir". Si lo negaste antes, actívalo en los ajustes del navegador o del teléfono para este sitio.']}]},{id:"app",emoji:"📱",title:"Instalar, actualizar y usar sin internet",items:[{q:"¿La descargo de la App Store o de Google Play?",a:['No hace falta. La Fructosa se instala desde el navegador y queda en tu pantalla de inicio como cualquier app, a pantalla completa. En iPhone: ábrela en Safari, toca Compartir y "Agregar a la pantalla de inicio". En Android: ábrela en Chrome y toca "Instalar". Los pasos completos están en el Manual de uso.']},{q:"¿Cómo se actualiza?",a:['Sola. Cuando hay una versión nueva, arriba aparece "Hay una versión nueva de La Fructosa": toca "Actualizar" y listo. No pierdes nada.']},{q:"¿Funciona sin internet?",a:['Sí. Sin señal, la app abre con lo último que cargó y puedes seguir anotando. Verás "⏳ movimientos por subir" y se suben solos cuando vuelve la conexión, sin duplicarse. Lo que sí necesita internet: el Copiloto IA, subir fotos de comprobantes y traer datos nuevos.']},{q:"¿Me puede avisar cuando vence un pago?",a:["Sí. En Ajustes › Avisos activas recordatorios de pagos fijos, préstamos y respaldo. Llegan a las 8:30 a. m. En iPhone, primero instala la app en la pantalla de inicio y ábrela desde ahí."]},{q:"¿Puedo ponerla en modo claro?",a:["Sí. En Ajustes › Apariencia eliges Oscuro, Claro o Automático (sigue el modo de tu teléfono)."]},{q:"Quiero ver el tour otra vez",a:['En Más › Manual de uso toca "Ver el tour otra vez".']}]},{id:"inversiones",emoji:"📈",title:"Inversiones",only:"investments",items:[{q:"¿Qué puedo registrar en Inversiones?",a:["Acciones, fondos, cripto, plazos fijos u otras. De cada una guardas el tipo, el monto invertido, la moneda, el valor actual, la fecha y una nota opcional."]},{q:"¿El valor actual se actualiza solo?",a:["No. Tú lo escribes: abre la inversión y cambia el valor actual cuando revises tu broker o tu exchange. La app recalcula la ganancia al momento."]},{q:"¿Cómo se calcula la ganancia o pérdida?",a:["Valor actual menos monto invertido, en dinero y en porcentaje. La ves por inversión, por tipo y en total, convertida a tu moneda principal."]},{q:"¿Las inversiones mueven dinero de mis cuentas?",a:["No. Son un registro aparte: no restan de ninguna cuenta. Su valor actual sí suma a tu patrimonio total del Inicio."]},{q:"¿Quién más ve esta sección?",a:["Nadie. Inversiones solo aparece en las cuentas que tienen el permiso activado en el servidor, y la app no puede encenderlo ni apagarlo. Además, cada quien ve solo sus propias inversiones. El Copiloto y el respaldo en Excel las incluyen solo para ti."]}]}];function ne(a,o={}){return a?a==="rates"?!!o.region?.rates:a==="investments"?o.investmentsOn===!0:Array.isArray(a)&&a.includes(o.region?.code):!0}function ie(a,o){if(a&&a.__when)return ne(a.only,o)?ie(a.text,o):null;if(a&&a.__v){let e=o.region?.code||"VE";return e in a?a[e]:a.VE}return a}function qe(a={}){return Ge.filter(o=>ne(o.only,a)).map(o=>({...o,items:o.items.filter(e=>ne(e.only,a)).map(e=>({q:ie(e.q,a),a:e.a.map(t=>ie(t,a)).filter(t=>t!=null)})).filter(e=>e.q&&e.a.length)})).filter(o=>o.items.length)}var E=(a,o,e,t=a)=>({__v:!0,VE:a,ES:o,US:e,INT:t}),He=[{emoji:"📏",title:"Mide todo, desde hoy",why:"Lo que no se mide no se puede mejorar. La mayoría de la gente cree que sabe en qué gasta, hasta que lo anota un mes completo.",how:"Registra cada gasto con el botón + del centro, por pequeño que sea: el café, el estacionamiento, la propina.",result:"Después de 30 días, Análisis te muestra en qué se va tu dinero por categoría, con cifras reales y no con suposiciones."},{emoji:"⚡",title:"Anota en los primeros 10 segundos",why:"Si lo dejas para después, se te olvida la mitad. Anotar al momento es el hábito que separa a quien controla su dinero de quien lo intenta.",how:'Toca el micrófono en Inicio y di "gasté 8 en el almuerzo", o mándale a Fructosa la captura del pago. Tú solo confirmas.',result:"Tus saldos siempre cuadran y cada semana necesitas menos ajustes al conciliar."},{emoji:"🐜",title:"Caza los gastos hormiga",why:"Los gastos pequeños y repetidos (cafés, snacks, delivery, apps) suelen sumar entre el 10% y el 20% del mes sin que te des cuenta.",how:"En Movimientos abre el calendario: los días con más gasto se pintan más fuerte. Toca esos días y mira qué se repite.",result:"Descubres tu patrón (por ejemplo, los viernes) y puedes ponerle un tope a esa categoría."},{emoji:"🥇",title:"Págate primero",why:"Si ahorras lo que sobra a fin de mes, casi nunca sobra nada. Si apartas el ahorro el día que cobras, el resto del mes te ajustas solo.",how:E("El día que cobres, haz una Transferencia de tu cuenta principal a una cuenta de ahorro en dólares o USDT, o abona a una Meta de ahorro.","El día que cobres la nómina, haz una Transferencia de tu cuenta principal a una cuenta de ahorro, o abona a una Meta de ahorro.","El día que cobres tu paycheck, haz una Transferencia de tu checking a tu savings, o abona a una Meta de ahorro.","El día que cobres, haz una Transferencia de tu cuenta principal a una cuenta de ahorro, o abona a una Meta de ahorro."),result:"En Inicio ves crecer tu ahorro mes a mes, y el porcentaje de ahorro sube sin esfuerzo."},{emoji:"🛟",title:"Arma tu fondo de emergencia",why:"Una emergencia sin ahorro se convierte en deuda. Lo ideal es tener entre 3 y 6 meses de tus gastos básicos guardados aparte.",how:E('Crea una Meta de ahorro llamada "Emergencias" en una moneda estable (USD o USDT), con un monto y una fecha.','Crea una Meta de ahorro llamada "Emergencias" en euros, con un monto y una fecha.','Crea una Meta de ahorro llamada "Emergency fund" en dólares, con un monto y una fecha.','Crea una Meta de ahorro llamada "Emergencias" en una moneda estable, con un monto y una fecha.'),result:"La app te dice cuánto apartar cada mes para llegar a tiempo, y ves la barra avanzar con cada abono."},{emoji:"🧮",title:"Reparte con la regla 50/30/20",why:"Es la forma más sencilla de equilibrar: 50% para necesidades, 30% para gustos y 20% para ahorro y deudas.",how:"En Más › Presupuestos ponle un tope a tus categorías de necesidades (mercado, servicios, alquiler) y otro a tus gustos (salidas, suscripciones).",result:"Cada barra se pone amarilla al 80% y roja al pasarte, así sabes a mitad de mes si vas bien."},{emoji:"🎯",title:"Un presupuesto donde más te duele",why:"No necesitas presupuestar todo. Con poner tope a las 2 o 3 categorías donde más se te va el dinero ya cambias el mes.",how:"Abre Análisis, mira tus tres categorías más altas y crea un presupuesto solo para esas en Más › Presupuestos.",result:'El "ritmo" del presupuesto te dice si vas gastando más rápido que los días del mes.'},{emoji:"⚖️",title:"Concilia cada domingo",why:"Quince minutos a la semana mantienen tus números exactos y te avisan de fugas a tiempo, no a fin de mes.",how:'Compara el saldo de cada cuenta en Más › Cuentas con el real. Si no cuadra, busca lo que faltó anotar o toca "Ajustar".',result:"Tu patrimonio en Inicio es real. Y si cada semana ajustas menos, es la prueba de que ya no se te escapan gastos."},{emoji:"📅",title:"Los lunes, un solo ajuste",why:"Querer cambiar diez cosas a la vez no funciona. Un cambio pequeño por semana sí se sostiene.",how:"Cada lunes abre Análisis, compara con el mes anterior y elige UNA cosa para mejorar esa semana.",result:"En un mes llevas cuatro mejoras reales, y Análisis te muestra qué categorías bajaron frente al mes anterior."},{emoji:"🌱",title:"Tu número estrella: la tasa de ahorro",why:"Más que cuánto ganas, importa qué porcentaje te queda. Por encima del 20% vas muy bien; entre el 10% y el 20% es saludable.",how:"En Inicio y en Análisis ves el porcentaje de tus ingresos que te está quedando este mes.",result:"Ponte una meta (por ejemplo, subir 2 puntos cada mes) y mira cómo Análisis te celebra con 🌱 y 🏆."},{emoji:"🔁",title:"Programa tus pagos fijos",why:"Los recargos por pagar tarde son dinero tirado. Y los gastos fijos son los que más pesan en tu mes.",how:E("En Más › Pagos
