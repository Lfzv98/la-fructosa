/* =====================================================================
   La Fructosa · El libro (manual.html)
   Papel crema, tapa de tela azul con azulejos de la casa y hojas que se doblan.
   ===================================================================== */
:root {
  --desk: #0E1422;
  --desk-2: #1A2540;
  --bar: rgba(14, 20, 34, 0.78);
  --bar-text: #F5F8FF;
  --bar-muted: #9AABCB;
  --line: rgba(160, 196, 255, 0.16);

  --paper: #FBF8F1;
  --paper-2: #F3EDE0;
  --ink: #2B2A33;
  --ink-2: #5B5866;
  --navy: #24497C;
  --navy-2: #2F5E9E;
  --cloth: #1D3762;
  --gold: #F2D48A;
  --salmon: #EFA090;
  --yellow: #F7DE95;
  --blue: #AFCDEE;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, Cambria, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --desk: #E4E9F2;
  --desk-2: #F4F6FA;
  --bar: rgba(248, 250, 253, 0.82);
  --bar-text: #17213A;
  --bar-muted: #5B6B88;
  --line: rgba(23, 33, 58, 0.12);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 35%, var(--desk-2), var(--desk) 70%);
  color: var(--bar-text);
  font: 15px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  overscroll-behavior: none;
  height: 100dvh;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { opacity: .35; cursor: default; }
a { color: inherit; }
:focus-visible { outline: 2px solid #A0C4FF; outline-offset: 2px; border-radius: 8px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Barras ---------- */
.lb-top, .lb-bottom {
  position: relative; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: var(--bar);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.lb-top { padding-top: calc(8px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); }
.lb-bottom { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.lb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; height: 40px; border-radius: 12px; padding: 0 8px; color: var(--bar-text); }
.lb-btn:hover:not(:disabled) { background: var(--line); }
.lb-home { text-decoration: none; padding-left: 2px; }
.lb-home img { border-radius: 8px; }
.lb-home span { font-weight: 700; letter-spacing: -.01em; }
.lb-home svg { width: 18px; height: 18px; color: var(--bar-muted); }
.lb-where { flex: 1; min-width: 0; margin: 0; text-align: center; color: var(--bar-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-tools { display: flex; gap: 2px; }
#lb-text b { font-family: var(--serif); font-size: 17px; }
#lb-sound .off { display: none; }
#lb-sound.muted .on { display: none; }
#lb-sound.muted .off { display: inline; }
#lb-sound.muted { color: var(--bar-muted); }
#lb-range { flex: 1; min-width: 60px; accent-color: #A0C4FF; height: 28px; }
.lb-count { min-width: 92px; text-align: center; font-size: 13px; color: var(--bar-muted); font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { .lb-home span { display: none; } .lb-count { min-width: 74px; font-size: 12px; } }
body.no-country .lb-bottom { visibility: hidden; }

/* ---------- Escenario ---------- */
.lb-stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.lb-loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; color: var(--bar-muted); }
.lb-loading img { border-radius: 20px; animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.92); opacity: .7; } }

/* ---------- Libro (motor) ---------- */
.fb { position: relative; touch-action: none; -webkit-touch-callout: none; transition: transform .6s cubic-bezier(.3, .7, .2, 1); }
/* Libro cerrado: se centra la tapa. */
.fb-spread.fb-closed-front { transform: translateX(calc(var(--W) * -0.5)); }
.fb-spread.fb-closed-back { transform: translateX(calc(var(--W) * 0.5)); }
.fb-spine { position: absolute; top: 0; left: 0; width: 0; height: 100%; }
.fb-slot, .fb-front, .fb-back { position: absolute; top: 0; width: var(--W); height: var(--H); }
.fb-slot.fb-r, .fb-front { left: 0; }
.fb-slot.fb-l { left: calc(var(--W) * -1); }
.fb-slot:empty { display: none; }
.fb-slot { z-index: 1; box-shadow: 0 18px 50px rgba(0, 0, 0, .38), 0 3px 10px rgba(0, 0, 0, .22); }
.fb-shade-r { position: absolute; z-index: 2; left: 0; top: 0; width: var(--W); height: var(--H); pointer-events: none; }
.fb-front { z-index: 3; }
.fb-flap { position: absolute; z-index: 4; left: 0; top: 0; width: 0; height: 0; filter: drop-shadow(0 0 9px rgba(0, 0, 0, .3)); pointer-events: none; }
.fb-back { left: 0; transform-origin: 0 0; will-change: transform, clip-path; }
.fb-gloss { position: absolute; left: calc(var(--W) * -1); top: 0; width: calc(var(--W) * 2); height: var(--H); }
.fb-front, .fb-back { will-change: clip-path; }
.fb-backpaper { position: absolute; inset: 0; background: rgba(250, 246, 237, .9); }
.fb-flipping { cursor: grabbing; }
/* Canto de las hojas (más grueso del lado que falta por leer). */
.fb-slot.fb-r::after, .fb-slot.fb-l::after {
  content: ''; position: absolute; top: 4px; bottom: 4px; pointer-events: none; z-index: -1;
  background: repeating-linear-gradient(90deg, #F4EFE3 0 1px, #D9D1C0 1px 2px);
}
.fb-slot.fb-r::after { right: calc(var(--rt, 4px) * -1); width: var(--rt, 4px); border-radius: 0 3px 3px 0; }
.fb-slot.fb-l::after { left: calc(var(--lt, 4px) * -1); width: var(--lt, 4px); border-radius: 3px 0 0 3px; }
.fb:not(.fb-spread) .fb-slot.fb-r::after { width: var(--rt, 4px); }

/* ---------- Página ---------- */
.pg {
  position: absolute; inset: 0; width: var(--W); height: var(--H); overflow: hidden;
  background:
    radial-gradient(140% 100% at 50% 0%, rgba(255, 255, 255, .55), transparent 60%),
    repeating-radial-gradient(circle at 30% 20%, rgba(120, 100, 60, .025) 0 1px, transparent 1px 3px),
    var(--paper);
  color: var(--ink);
  font-size: var(--fs, 16px);
}
/* Sombra del lomo: a la izquierda en páginas derechas y en el teléfono; a la derecha en las izquierdas. */
.pg::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: linear-gradient(90deg, rgba(60, 45, 20, .16), rgba(60, 45, 20, .05) 4%, transparent 9%); }
.fb-spread .pg.odd::before, .lb-measure.spread .pg.odd::before { background: linear-gradient(270deg, rgba(60, 45, 20, .16), rgba(60, 45, 20, .05) 4%, transparent 9%); }
.pg-content { display: flex; flex-direction: column; padding: calc(var(--fs) * 1.6) calc(var(--fs) * 1.7) calc(var(--fs) * 1.1) calc(var(--fs) * 1.9); }
.fb-spread .pg-content.odd, .lb-measure.spread .pg-content.odd { padding-left: calc(var(--fs) * 1.7); padding-right: calc(var(--fs) * 1.9); }
.pg-head { display: flex; justify-content: space-between; gap: 12px; font: 600 calc(var(--fs) * .62)/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: #9C8F74; padding-bottom: calc(var(--fs) * .5); border-bottom: 1px solid rgba(156, 143, 116, .28); margin-bottom: calc(var(--fs) * .9); }
.pg-head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pg-head span:first-child { flex-shrink: 0; max-width: 55%; }
.pg-body { flex: 1; min-height: 0; overflow: hidden; font-family: var(--serif); line-height: 1.5; hyphens: auto; -webkit-hyphens: auto; }
.pg-foot { padding-top: calc(var(--fs) * .5); text-align: center; font: 600 calc(var(--fs) * .72)/1 var(--serif); color: #9C8F74; }
.pg-num::before, .pg-num::after { content: '—'; margin: 0 .5em; opacity: .5; font-weight: 400; }

.pg-body > * { margin: 0 0 calc(var(--fs) * .62); }
.pg-body p { text-align: justify; }
.pg-body p.cut { text-align-last: justify; margin-bottom: 0; }
.pg-body h3 { font: 700 calc(var(--fs) * 1.04)/1.3 var(--sans); color: var(--navy); margin-top: calc(var(--fs) * 1); letter-spacing: -.01em; }
.pg-body > h3:first-child, .pg-body > .ch + h3 { margin-top: 0; }

/* Parte */

.cv-frame { position: absolute; inset: calc(var(--fs) * 1.1); border: 1.5px solid rgba(242, 212, 138, .55); border-radius: 6px; box-shadow: inset 0 0 0 4px rgba(242, 212, 138, .14); pointer-events: none; }

.cv-kicker { margin: calc(var(--fs) * 1.3) 0 0; font: 700 calc(var(--fs) * .72)/1 var(--sans); letter-spacing: .32em; text-transform: uppercase; color: var(--gold); opacity: .85; }
.cv-title { margin: calc(var(--fs) * .3) 0 0; font: 700 calc(var(--fs) * 2.9)/1 var(--serif); letter-spacing: -.01em;
  background: linear-gradient(180deg, #FFF3C8 10%, #E9C46A 55%, #B98F35 95%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .35)); }

  font: 700 calc(var(--fs) * .95)/1 var(--sans); color: #17213A; background: linear-gradient(180deg, #FFF0BF, #E9C46A); box-shadow: 0 8px 22px rgba(0, 0, 0, .35); }

/* ---------- Medidor (invisible) ---------- */
.lb-measure { position: fixed; left: -20000px; top: 0; visibility: hidden; pointer-events: none; }
.lb-measure .pg { position: relative; }

/* ---------- Índice rápido, letra y avisos ---------- */

.lb-sheet[hidden] { display: none; }
.lb-sheet-card { width: min(560px, 100%); max-height: 82dvh; display: flex; flex-direction: column; background: var(--desk-2); color: var(--bar-text); border-radius: 22px 22px 0 0; border: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
@media (min-width: 700px) { .lb-sheet { place-items: center; } .lb-sheet-card { border-radius: 22px; } }
.lb-sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 6px 20px; }
.lb-sheet-head h2 { margin: 0; font: 700 20px/1.2 var(--serif); }
.lb-sheet-body { overflow: auto; padding: 4px 10px 16px; display: grid; gap: 2px; }
.sh-part, .sh-ch { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 12px; }
.sh-part { margin-top: 8px; background: var(--line); }
.sh-part span { font: 800 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: #FFADAD; white-space: nowrap; }

.sh-part b, .sh-ch b { flex: 1; font-weight: 600; }
.sh-part i, .sh-ch i { font-style: normal; color: var(--bar-muted); font-variant-numeric: tabular-nums; }
.sh-ch:hover, .sh-part:hover { background: rgba(160, 196, 255, .14); }
.lb-pop { position: fixed; z-index: 30; top: calc(60px + env(safe-area-inset-top, 0px)); right: 12px; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 14px;
  background: var(--desk-2); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0, 0, 0, .35); }
.lb-pop[hidden] { display: none; }
.lb-pop span { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; color: var(--bar-muted); font-size: 13px; }
.lb-pop small { font-family: var(--serif); font-size: 13px; }
.lb-pop b { font-family: var(--serif); font-size: 20px; }
.lb-toast { position: fixed; z-index: 50; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px);
  padding: 10px 14px; border-radius: 14px; background: #F5F8FF; color: #17213A; font-weight: 600; font-size: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); animation: rise .25s ease; }
.lb-toast[hidden] { display: none; }
.lb-toast button { margin-left: 8px; padding: 6px 10px; border-radius: 10px; background: #24497C; color: #fff; font-weight: 700; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translate(var(--tx, 0), 16px); opacity: 0; } }
.lb-toast { --tx: -50%; }

@media (prefers-reduced-motion: reduce) { .cv-hand, .lb-loading img { animation: none; } }

/* ---------- PDF ---------- */
#lb-print { display: none; }
body.printing { display: block; height: auto; overflow: visible; background: #fff; }
body.printing > :not(#lb-print) { display: none !important; }
body.printing #lb-print { display: block; }
#lb-print .pg { position: relative; break-after: page; page-break-after: always; }
#lb-print .cv-change, #lb-print .cv-hint, #lb-print .cv-chips, #lb-print .cv-ask { display: none !important; }
@media print { @page { margin: 0; } html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
.lb-btn[hidden] { display: none; }

s:[P('Transferencia es mover dinero entre TUS cuentas (por ejemplo, de Zelle a Binance). No es gasto ni ingreso: tu patrimonio no cambia. Elige "Desde" y "Hacia"; si las monedas son distintas, escribe cu\xE1nto lleg\xF3 y la app calcula la tasa a la que cambiaste.','Transferencia es mover dinero entre TUS cuentas (por ejemplo, de tu banco a Revolut). No es gasto ni ingreso: tu patrimonio no cambia. Elige "Desde" y "Hacia"; si las monedas son distintas, escribe cu\xE1nto lleg\xF3 y la app calcula la tasa a la que cambiaste.','Transferencia es mover dinero entre TUS cuentas (por ejemplo, de tu checking a tu savings). No es gasto ni ingreso: tu patrimonio no cambia. Elige "Desde" y "Hacia".'),P('Si pagas en bol\xEDvares desde una cuenta en d\xF3lares o USDT, activa "Pagu\xE9 en bol\xEDvares": escribe los Bs. y la tasa que usaste, y la app te dice el costo real en d\xF3lares y cu\xE1nto te ahorr\xF3 o te cost\xF3 la brecha frente al BCV.',null,null),"\xBFTe equivocaste? Toca el movimiento en Movimientos para corregirlo o borrarlo."]},{id:"copiloto",emoji:"\u2728",title:"Copiloto IA (Fructosa): voz, texto y capturas",intro:'Fructosa es tu asistente con inteligencia artificial. Conoce tus cuentas y te ayuda a registrar sin escribir formularios. \xC1brela con el bot\xF3n "Copiloto IA" del inicio.',steps:[P('Texto libre: escribe como hablas, por ejemplo "gast\xE9 12 d\xF3lares en el mercado con Zelle" o "me pagaron 300 de sueldo en Banesco".','Texto libre: escribe como hablas, por ejemplo "gast\xE9 12 euros en el s\xFAper con Bizum" o "me pagaron 1.500 de n\xF3mina en BBVA".','Texto libre: escribe como hablas, por ejemplo "gast\xE9 12 d\xF3lares en el s\xFAper con Apple Pay" o "me pagaron 2.000 de sueldo en Chase".','Texto libre: escribe como hablas, por ejemplo "gast\xE9 12 d\xF3lares en el mercado" o "me pagaron 300 de sueldo en mi banco".'),"Nota de voz: toca el micr\xF3fono \u{1F399}\uFE0F y dilo en voz alta. Lo que dices se escribe en tiempo real; cuando termines, toca enviar.",P("Captura o foto: toca la c\xE1mara \u{1F4F7} y elige la captura del comprobante (Pago M\xF3vil, transferencia, Zelle, Binance, PayPal, Zinli, una factura o un ticket).","Captura o foto: toca la c\xE1mara \u{1F4F7} y elige la captura del comprobante (Bizum, transferencia de tu banco, Revolut, PayPal, una factura o un ticket).","Captura o foto: toca la c\xE1mara \u{1F4F7} y elige la captura del comprobante (Zelle, Venmo, Cash App, tu banco, una factura o un recibo).","Captura o foto: toca la c\xE1mara \u{1F4F7} y elige la captura del comprobante (transferencia, PayPal, Wise, Binance, una factura o un ticket)."),'Fructosa te muestra el movimiento listo: monto, moneda, fecha, cuenta y categor\xEDa. Rev\xEDsalo y toca "Registrar", o "Descartar" si algo no cuadra.'],tips:['Nada se guarda sin que toques "Registrar".',P('Tambi\xE9n responde preguntas: "\xBFcu\xE1nto tengo en total?", "\xBFen qu\xE9 gast\xE9 m\xE1s este mes?", "calc\xFAlame 400 euros a tasa BCV".','Tambi\xE9n responde preguntas: "\xBFcu\xE1nto tengo en total?", "\xBFen qu\xE9 gast\xE9 m\xE1s este mes?", "\xBFqu\xE9 debo saber de la declaraci\xF3n de la renta?".','Tambi\xE9n responde preguntas: "\xBFcu\xE1nto tengo en total?", "\xBFen qu\xE9 gast\xE9 m\xE1s este mes?", "\xBFqu\xE9 debo saber de mis taxes?".','Tambi\xE9n responde preguntas: "\xBFcu\xE1nto tengo en total?", "\xBFen qu\xE9 gast\xE9 m\xE1s este mes?".'),P("Si una captura es un cambio de divisa entre tus propias cuentas (vender USDT y recibir bol\xEDvares), te pedir\xE1 anotarlo como Transferencia con el bot\xF3n +.","Si una captura es un movimiento entre tus propias cuentas (por ejemplo, comprar USDT desde tu banco), te pedir\xE1 anotarlo como Transferencia con el bot\xF3n +.","Si una captura es un movimiento entre tus propias cuentas (por ejemplo, de checking a savings), te pedir\xE1 anotarlo como Transferencia con el bot\xF3n +."),"Por tu seguridad, Fructosa nunca repite n\xFAmeros de cuenta, c\xE9dulas ni tel\xE9fonos que aparezcan en una imagen. La primera vez te pide permiso para usar la IA; si el navegador pide el micr\xF3fono, acepta."]},{id:"conciliacion",emoji:"\u2696\uFE0F",title:"Conciliaci\xF3n semanal: tu saldo igual a la realidad",intro:"Conciliar es comparar el saldo de la app con el de tu banco o tu cartera y corregir la diferencia. Hazlo una vez por semana (por ejemplo, cada domingo) y tu patrimonio siempre ser\xE1 real.",steps:["Abre la app de tu banco (o cuenta el efectivo) y anota el saldo real de cada cuenta.","En La Fructosa entra a M\xE1s \u203A Cuentas y toca la cuenta.",P("Si el saldo coincide, listo. Si no, revisa en su lista de movimientos si te falt\xF3 anotar algo (una comisi\xF3n, un Pago M\xF3vil, una compra peque\xF1a) y reg\xEDstralo.","Si el saldo coincide, listo. Si no, revisa en su lista de movimientos si te falt\xF3 anotar algo (una comisi\xF3n, un Bizum, una compra peque\xF1a) y reg\xEDstralo.","Si el saldo coincide, listo. Si no, revisa en su lista de movimientos si te falt\xF3 anotar algo (un fee, un pago con Zelle o Venmo, una compra peque\xF1a) y reg\xEDstralo.","Si el saldo coincide, listo. Si no, revisa en su lista de movimientos si te falt\xF3 anotar algo (una comisi\xF3n, una transferencia, una compra peque\xF1a) y reg\xEDstralo."),'Si a\xFAn hay diferencia, toca "Ajustar", escribe el saldo real y confirma. La app registra la diferencia como "Ajuste de saldo".',"Repite con cada cuenta y termina en An\xE1lisis para ver c\xF3mo va el mes."],tips:["Un ajuste grande o frecuente es una se\xF1al: hay gastos que se te escapan. An\xF3talos al momento la semana siguiente.","Las comisiones bancarias y de cambio cuentan: an\xF3talas como gasto para que el saldo cuadre."]},{id:"exportar",emoji:"\u{1F4E4}",title:"Exportaci\xF3n y respaldo: Excel y CSV",intro:"Tus datos son tuyos y puedes llev\xE1rtelos cuando quieras para tu control local.",steps:['Respaldo completo en Excel: M\xE1s \u203A Ajustes \u203A Respaldo \u203A "Descargar todos mis datos (Excel)". Trae resumen, cuentas, movimientos, presupuestos, pagos fijos, metas, pr\xE9stamos y tasas.',"Movimientos en Excel: en Movimientos filtra lo que quieras (mes, cuenta, categor\xEDa) y toca el \xEDcono de descarga \u2B07\uFE0F. En An\xE1lisis, el mismo \xEDcono exporta el mes que est\xE1s viendo. En M\xE1s tambi\xE9n puedes exportarlo todo en Excel o en CSV (texto simple).",'En iPhone, cuando aparezca el men\xFA de compartir, toca "Guardar en Archivos" y elige una carpeta (iCloud Drive o En mi iPhone). En computadora se descarga directo.',"Abre el archivo en Excel, Numbers o Google Sheets. Viene listo para leer: encabezados en azul oscuro, ingresos en verde (+), gastos en rojo (\u2212), transferencias en azul, ajustes e inactivos en gris y totales en amarillo. La hoja Resumen trae la gu\xEDa de colores, y cada tabla tiene filtros."],tips:["Haz tu respaldo cada semana, despu\xE9s de conciliar. Si pasan 7 d\xEDas sin respaldo, la app te lo recuerda."]}],Ge=[{emoji:"\u{1F4B0}",title:"Tu resumen en el inicio",body:["Arriba ves cu\xE1nto tienes en total, sumando todas tus cuentas en una sola moneda (c\xE1mbiala con los botones de la derecha). Debajo, cu\xE1nto entr\xF3, cu\xE1nto sali\xF3 y qu\xE9 porcentaje te est\xE1 quedando este mes.","El \xEDcono del ojo oculta los montos si est\xE1s en un lugar p\xFAblico."]},{emoji:"\u{1F4B1}",title:"El d\xF3lar de hoy: BCV, Paralelo y USDT",only:"rates",body:["Ves el d\xF3lar oficial (BCV), el del mercado (Paralelo), el USDT y el Euro BCV. Se actualizan solos varias veces al d\xEDa; en Tasas tambi\xE9n puedes tocar actualizar.","La brecha es cu\xE1nto m\xE1s cuesta el d\xF3lar del mercado que el oficial. En Tasas tienes una calculadora para convertir entre d\xF3lares, euros y bol\xEDvares.","En Tasas \u203A Historial eliges una tasa y ves c\xF3mo se movi\xF3 en el \xFAltimo mes, 3 meses, 6 meses o el a\xF1o, con su m\xEDnimo, su m\xE1ximo y cu\xE1nto subi\xF3. Toca la l\xEDnea para leer el valor de cada d\xEDa."]},{emoji:"\u{1F3AF}",title:"Presupuestos y pagos fijos",body:["Un presupuesto es el tope mensual de una categor\xEDa (por ejemplo, mercado: 200 $). La barra se pone amarilla al 80% y roja al pasarte.","Los pagos fijos son los que se repiten (alquiler, internet, colegio). La app te recuerda cu\xE1ndo vencen y los registra con un toque."]},{emoji:"\u{1F3C1}",title:"Metas de ahorro y pr\xE9stamos",body:["En M\xE1s \u203A Metas de ahorro creas una meta con su monto y fecha y vas abonando; la app te dice cu\xE1nto apartar cada mes.",'En M\xE1s \u203A Por cobrar y pagar anotas qui\xE9n te debe y a qui\xE9n le debes. Con "Me pag\xF3" o "Pagu\xE9" registras abonos.']},{emoji:"\u{1F4CE}",title:"Comprobantes",body:['Al registrar o editar un movimiento, toca "Adjuntar foto del recibo o captura" y elige una foto o t\xF3mala en el momento. Queda guardada con ese movimiento y solo t\xFA puedes verla.',"Los movimientos con comprobante muestran un \u{1F4CE}. Abre el movimiento y toca la foto para verla en grande. Necesitas conexi\xF3n para subirla."]},{emoji:"\u{1F4C5}",title:"Calendario de gastos",body:["En Movimientos, el bot\xF3n del calendario muestra el mes por d\xEDas. Cada d\xEDa dice cu\xE1nto gastaste y se pinta m\xE1s fuerte cuanto m\xE1s gastaste; el punto verde indica que ese d\xEDa entr\xF3 dinero.","Toca un d\xEDa para ver solo sus movimientos y sus totales. T\xF3calo otra vez para volver a todo el mes."]},{emoji:"\u{1F6D2}",title:"Lista de compras",body:["En M\xE1s \u203A Lista de compras anotas lo que necesitas, con cantidad y precio si lo sabes. La app te dice el total estimado antes de llegar a la caja.",'Marca cada producto al meterlo en el carrito. Al pagar, "Registrar gasto" abre el formulario con el total de lo marcado. Puedes tener varias listas (mercado, farmacia\u2026).']},{emoji:"\u{1F399}\uFE0F",title:"Dictar un gasto",body:['Toca el micr\xF3fono de arriba en Inicio y di el gasto, por ejemplo "gast\xE9 10 en el almuerzo". Fructosa lo prepara y t\xFA solo confirmas.','En Android, mant\xE9n presionado el \xEDcono de La Fructosa y elige "Dictar un gasto" para ir directo.']},{emoji:"\u{1F4CA}",title:"An\xE1lisis del mes",body:[P("En qu\xE9 se va tu dinero, la comparaci\xF3n con el mes anterior, tu tasa de ahorro y, si usas bol\xEDvares, cu\xE1nto te ahorr\xF3 o cost\xF3 la brecha.","En qu\xE9 se va tu dinero, la comparaci\xF3n con el mes anterior y tu tasa de ahorro.","En qu\xE9 se va tu dinero, la comparaci\xF3n con el mes anterior y tu tasa de ahorro.")]},{emoji:"\u{1F4F6}",title:"Sin internet tambi\xE9n funciona",body:['Sin se\xF1al, la app abre con lo \xFAltimo que carg\xF3 y puedes seguir anotando. Arriba ver\xE1s "\u23F3 movimientos por subir": se suben solos al volver la conexi\xF3n, sin duplicarse.']},{emoji:"\u{1F514}",title:"Avisos en tu tel\xE9fono",body:["En Ajustes \u203A Avisos activas recordatorios de pagos fijos, pr\xE9stamos, respaldo y las tasas de la ma\xF1ana.",'En iPhone, primero instala la app en tu pantalla de inicio (ver "Instalar en iPhone").']},{emoji:"\u{1F512}",title:"Bloqueo con Face ID, huella o PIN",body:['En Ajustes \u203A Privacidad y seguridad activas el bloqueo. Si olvidas el PIN, toca "Olvid\xE9 mi PIN" y entras de nuevo con tu contrase\xF1a.']},{emoji:"\u{1F6E1}\uFE0F",title:"Tu privacidad",body:["Cada persona tiene su propia cuenta y nadie m\xE1s puede ver sus datos: el servidor lo bloquea. La app no se conecta a tu banco ni pide claves bancarias.","En Ajustes \u203A T\xE9rminos y privacidad lees los t\xE9rminos, y en Ajustes \u203A Borrar mi cuenta eliminas tu cuenta con todos sus datos."]},{emoji:"\u{1F317}",title:"Modo claro u oscuro",body:["En Ajustes \u203A Apariencia eliges Oscuro, Claro o Autom\xE1tico."]}],ve={motto:"Lo que no se mide, no se controla ni se mejora.",intro:"La Fructosa funciona como un sistema: registrar, conciliar, revisar y ahorrar. Si sigues estos h\xE1bitos durante un mes, vas a saber exactamente a d\xF3nde va tu dinero y qu\xE9 cambiar.",tips:[{emoji:"\u{1F4CF}",title:"La regla de oro: mide todo",body:'No puedes mejorar lo que no ves. Anota cada gasto, por peque\xF1o que sea: el caf\xE9, el estacionamiento, la comisi\xF3n del banco. Los gastos "hormiga" suelen sumar entre el 10% y el 20% del mes.'},{emoji:"\u26A1",title:"Registra al momento",body:"Anota el gasto apenas pagues, en los siguientes diez segundos. Con Fructosa basta una nota de voz o la captura del comprobante. No dejes acumular capturas: despu\xE9s de dos d\xEDas ya no recuerdas la mitad."},{emoji:"\u2696\uFE0F",title:"Concilia cada semana",body:"Elige un d\xEDa fijo (domingo funciona bien) y compara el saldo de cada cuenta con el real. Quince minutos a la semana mantienen tu patrimonio exacto y te avisan de fugas a tiempo."},{emoji:"\u{1F6DF}",title:"Fondo de emergencia primero",body:P("Antes de invertir o hacer compras grandes, junta entre 3 y 6 meses de tus gastos b\xE1sicos en una cuenta aparte y en una moneda estable (USD o USDT). Cr\xE9alo como Meta de ahorro y ab\xF3nale cada mes.","Antes de invertir o hacer compras grandes, junta entre 3 y 6 meses de tus gastos b\xE1sicos en una cuenta de ahorro aparte, en euros. Cr\xE9alo como Meta de ahorro y ab\xF3nale cada mes.","Antes de invertir o hacer compras grandes, junta entre 3 y 6 meses de tus gastos b\xE1sicos en una cuenta de ahorro (savings) aparte. Cr\xE9alo como Meta de ahorro y ab\xF3nale cada mes.","Antes de invertir o hacer compras grandes, junta entre 3 y 6 meses de tus gastos b\xE1sicos en una cuenta aparte y en una moneda estable. Cr\xE9alo como Meta de ahorro y ab\xF3nale cada mes.")},{emoji:"\u{1F3C1}",title:"Metas de ahorro con fecha",body:"Una meta sin fecha es un deseo. Ponle monto y fecha en M\xE1s \u203A Metas de ahorro y la app te dice cu\xE1nto apartar cada mes. P\xE1gate primero: cuando cobres, aparta el ahorro antes de gastar."},{emoji:"\u{1F9EE}",title:"Reparte con la regla 50/30/20",body:"50% para necesidades (mercado, servicios, alquiler), 30% para gustos y 20% para ahorro y deudas. Ponle un presupuesto a las categor\xEDas donde m\xE1s se te va el dinero."},{emoji:"\u{1F4B1}",title:"Cuida la brecha",body:"Si pagas en bol\xEDvares con respaldo en divisas, registra la tasa que usaste. La app te muestra cada mes cu\xE1nto te ahorr\xF3 o te cost\xF3.",only:"rates"},{emoji:"\u{1F1EA}\u{1F1F8}",title:"Espa\xF1a: impuestos sin complicarte",body:"El IVA ya va incluido en lo que pagas. La declaraci\xF3n de la renta (IRPF) se presenta en primavera, normalmente de abril a finales de junio, desde la web o la app de la Agencia Tributaria: guarda tus n\xF3minas y facturas importantes. Si tienes piso, el IBI llega una vez al a\xF1o: crea un pago fijo o una meta y aparta un poco cada mes. Anota lo que pagues en la categor\xEDa Impuestos. Para tu caso concreto, consulta con un gestor.",only:["ES"]},{emoji:"\u{1F1FA}\u{1F1F8}",title:"Estados Unidos: impuestos y cr\xE9dito, lo b\xE1sico",body:"El sales tax se suma en la caja: el precio de la etiqueta no es el final. La declaraci\xF3n anual (IRS) se presenta normalmente hasta el 15 de abril: guarda tus W-2 o 1099. Si trabajas por tu cuenta, aparta una parte de cada pago para impuestos. Paga el total de la tarjeta de cr\xE9dito cada mes: evitas intereses y cuidas tu credit score. Para tu caso concreto, consulta con un contador (CPA).",only:["US"]},{emoji:"\u{1F4C5}",title:"Revisa el mes los lunes",body:"Abre An\xE1lisis, mira tus tres categor\xEDas m\xE1s altas y comp\xE1ralas con el mes anterior. Decide un solo ajuste para la semana: es m\xE1s f\xE1cil cumplir uno que diez."}],weekly:["Cada d\xEDa: registra al momento (voz, captura o +).","Cada domingo: concilia tus cuentas y descarga tu respaldo.","Cada lunes: revisa An\xE1lisis y tus presupuestos.","Cada mes: abona a tu fondo de emergencia y a tus metas."]},Y={VE:{title:"Venezuela",text:"Pago M\xF3vil, efectivo en d\xF3lares y bol\xEDvares, Zelle, Binance (USDT) y tu banco venezolano. Adem\xE1s ves el d\xF3lar BCV, el Paralelo y el USDT, y la calculadora de brecha. Categor\xEDa extra: Condominio."},US:{title:"Estados Unidos",text:"Todo en d\xF3lares: tu banco (Chase, Bank of America, Wells Fargo, Citi, Capital One\u2026), checking y savings, tarjetas de cr\xE9dito, Zelle, Venmo, Cash App, Apple Pay y PayPal. Categor\xEDas extra: Alquiler (renta), Seguros, Impuestos, Propinas y Reembolso de impuestos."},ES:{title:"Espa\xF1a",text:"Todo en euros: tu banco (BBVA, Santander, CaixaBank, Sabadell, ING\u2026), la cuenta con IBAN, la tarjeta, el efectivo en euros, Bizum, Revolut y PayPal. Categor\xEDas extra: Alquiler, Comunidad, Seguros, Impuestos, Devoluci\xF3n de Hacienda y Ayudas."},INT:{title:"Otro pa\xEDs",text:"Panam\xE1, Colombia, Chile, M\xE9xico, Per\xFA o donde vivas: tu banco local en d\xF3lares o euros, Wise, PayPal, Zelle, Binance y, si la tienes, tu cuenta venezolana en bol\xEDvares. Categor\xEDas extra: Alquiler, Seguros e Impuestos."}},Ee=[`Copia el enlace ${I} y \xE1brelo en Safari.`,"Toca el bot\xF3n de Opciones o Compartir (los 3 puntos \u2022\u2022\u2022 o el \xEDcono de compartir, abajo a la derecha).",'Selecciona "Compartir" (Share).','Toca "Ver m\xE1s" (View More) si no aparece a primera vista.','Presiona "Agregar a la pantalla de inicio" (Add to Home Screen) y luego "Agregar".'],Se=[`Abre ${I} en Chrome.`,'Toca "Instalar" en el aviso, o el men\xFA \u22EE \u203A "Instalar app" (o "Agregar a pantalla principal").'],ye=(a,o)=>!a.only||(a.only==="rates"?!!(o!=null&&o.rates):Array.isArray(a.only)&&a.only.includes(o==null?void 0:o.code));function Ce(a,o){if(Array.isArray(a))return a.map(e=>Ce(e,o)).filter(e=>e!=null);if(a&&a.__v){let e=(o==null?void 0:o.code)||"VE";return e in a?a[e]:a.VE}return a}function je(a){let o=(e,t)=>({...e,...Object.fromEntries(t.map(r=>[r,Ce(e[r],a)]))});return{CORE:_e.map(e=>o(e,["intro","steps","tips"])),MORE:Ge.filter(e=>ye(e,a)).map(e=>o(e,["body"])),FINANCE_GUIDE:{...ve,tips:ve.tips.filter(e=>ye(e,a)).map(e=>o(e,["body"]))}}}var w=(a,o,e,t=a)=>({__v:!0,VE:a,ES:o,US:e,INT:t}),Q=(a,o)=>({__when:!0,only:a,text:o}),He=[{id:"privacidad",emoji:"\u{1F6E1}\uFE0F",title:"Privacidad y seguridad",items:[{q:"\xBFMi familia puede ver mi dinero o mis movimientos?",a:["No. Cada persona entra con su propio usuario y solo ve lo suyo. Cada registro lleva tu identificador y la base de datos (seguridad a nivel de fila) rechaza cualquier consulta de otra persona, aunque sea de la familia y aunque use el mismo tel\xE9fono con su propia sesi\xF3n.","Tampoco el Copiloto IA de otra persona puede ver tus datos: solo recibe los de quien est\xE1 conectado."]},{q:"\xBFLa app se conecta a mi banco o me pide mis claves bancarias?",a:["No. La Fructosa no se conecta a ning\xFAn banco, no mueve dinero y nunca te pide claves bancarias, n\xFAmeros de tarjeta ni documentos de identidad. Solo guarda lo que t\xFA anotas."]},{q:"\xBFD\xF3nde se guardan mis datos?",a:["En Supabase, un servicio profesional de bases de datos. Viajan cifrados (HTTPS) y tu contrase\xF1a se guarda cifrada: nadie puede leerla, ni siquiera el administrador.","Las fotos de comprobantes que adjuntes se guardan en un espacio privado de tu cuenta y solo t\xFA puedes verlas."]},{q:"\xBFVenden mis datos o hay publicidad?",a:["No. La app es gratuita, no tiene publicidad y no vende ni comparte tus datos. Solo intervienen los servicios que la hacen funcionar: Supabase, el servicio donde est\xE1 alojada la app y, si usas el Copiloto, Google Gemini.",Q("rates","Las tasas se consultan en fuentes p\xFAblicas sin enviar ning\xFAn dato tuyo.")]},{q:"\xBFY si alguien agarra mi tel\xE9fono?",a:["Activa el bloqueo en Ajustes \u203A Privacidad y seguridad: Face ID, huella o un PIN. Se pide al abrir la app y al volver si estuvo m\xE1s de un minuto en segundo plano. Despu\xE9s de 5 intentos fallidos hay que esperar 30 segundos.","El PIN no se guarda tal cual, solo una versi\xF3n cifrada en ese tel\xE9fono. Y si est\xE1s en un lugar p\xFAblico, toca el ojo del Inicio para ocultar los montos."]},{q:"Olvid\xE9 mi PIN, \xBFqu\xE9 hago?",a:['En la pantalla de bloqueo toca "Olvid\xE9 mi PIN". Se cierra la sesi\xF3n, entras de nuevo con tu usuario y contrase\xF1a y el bloqueo queda desactivado en ese tel\xE9fono. Lo vuelves a crear en Ajustes cuando quieras. Tus datos no se tocan.']}]},{id:"cuenta",emoji:"\u{1F464}",title:"Tu cuenta y contrase\xF1a",items:[{q:"\xBFPuedo entrar con mi correo en vez del usuario?",a:['S\xED. En "Usuario o correo" sirve cualquiera de los dos, junto con tu contrase\xF1a.']},{q:"Olvid\xE9 mi contrase\xF1a",a:['En la pantalla de entrada toca "\xBFLa olvidaste?", escribe el correo con el que te registraste y toca "Enviar enlace". Abre el enlace que te llega y la app te pide la contrase\xF1a nueva. Si no ves el correo, revisa la carpeta de spam.']},{q:"\xBFC\xF3mo cambio mi contrase\xF1a?",a:["En Ajustes \u203A Privacidad y seguridad \u203A Cambiar contrase\xF1a. Debe tener al menos 8 caracteres."]},{q:"\xBFPuedo cambiar mi nombre o mi usuario?",a:["Tu nombre s\xED: en Ajustes toca tu nombre arriba y escr\xEDbelo de nuevo. El usuario (@) es fijo, porque es con lo que entras."]},{q:"\xBFPuedo usarla en varios tel\xE9fonos, en el iPad o en la computadora?",a:["S\xED. Tus datos viven en tu cuenta, no en el tel\xE9fono: entra con tu usuario desde cualquier dispositivo y ver\xE1s lo mismo. En iPad y en computadora la app muestra un men\xFA lateral a la izquierda.","Lo \xFAnico que es de cada dispositivo es el bloqueo con PIN o huella y, si la pusiste, tu propia clave de IA."]},{q:"\xBFCu\xE1nto cuesta?",a:["Nada. La Fructosa es gratuita, sin suscripciones ni compras dentro de la app."]},{q:"\xBFC\xF3mo borro mi cuenta?",a:["En Ajustes \u203A Borrar mi cuenta. Antes te ofrece descargar tu respaldo y te pide escribir tu usuario para confirmar. Se borran tu cuenta y todos tus datos, incluida la conversaci\xF3n con Fructosa. Es inmediato y no se puede deshacer."]}]},{id:"monedas",emoji:"\u{1F4B5}",title:"Cuentas y monedas",items:[{q:"\xBFQu\xE9 monedas puedo usar?",a:[w("D\xF3lares (USD), bol\xEDvares (Bs.), USDT y euros (EUR).","Euros (EUR), d\xF3lares (USD) y USDT.","D\xF3lares (USD) y USDT.","D\xF3lares (USD), euros (EUR), USDT y, si conservas una cuenta en Venezuela, bol\xEDvares (Bs.).")]},{q:"\xBFUna cuenta puede tener dos monedas?",a:[w('No: cada cuenta tiene una sola moneda. Si tu banco te da una cuenta en bol\xEDvares y otra en d\xF3lares, crea dos cuentas (por ejemplo, "Banesco Bs." y "Banesco USD").','No: cada cuenta tiene una sola moneda. Si tienes euros y d\xF3lares en el mismo banco, crea dos cuentas (por ejemplo, "BBVA EUR" y "BBVA USD").','No: cada cuenta tiene una sola moneda. Si tienes d\xF3lares en el banco y USDT en un exchange, son dos cuentas (por ejemplo, "Chase" y "Coinbase USDT").','No: cada cuenta tiene una sola moneda. Si tienes dos monedas en el mismo banco, crea dos cuentas (por ejemplo, "Mi banco USD" y "Mi banco EUR").')]},{q:"\xBFC\xF3mo se calcula mi patrimonio total?",a:[w("La app convierte el saldo de cada cuenta a tu moneda principal con las tasas del d\xEDa y los suma. La moneda principal la cambias con los botones del Inicio o en Ajustes \u203A Regi\xF3n y moneda.","La app convierte el saldo de cada cuenta a tu moneda principal (euros o d\xF3lares) y los suma. La cambias con los botones del Inicio o en Ajustes \u203A Regi\xF3n y moneda.","La app suma el saldo de todas tus cuentas en d\xF3lares.","La app convierte el saldo de cada cuenta a tu moneda principal y los suma. La cambias con los botones del Inicio o en Ajustes \u203A Regi\xF3n y moneda."),Q("rates","En Ajustes tambi\xE9n eliges si los d\xF3lares se valoran a tasa BCV o Paralelo. Paralelo refleja mejor cu\xE1ntos d\xF3lares reales tendr\xEDas si cambiaras todo hoy."),Q("investments",'El valor actual de tus inversiones tambi\xE9n suma: debajo del total ves "Cuentas" e "Inversiones" por separado.')]},{q:"\xBFCu\xE1l es la diferencia entre una transferencia y un gasto?",a:[w("Una transferencia es mover dinero entre TUS cuentas (por ejemplo, de Zelle a Binance o vender USDT y recibir bol\xEDvares). No es gasto ni ingreso, as\xED que tu patrimonio no cambia. Si las monedas son distintas, escribes cu\xE1nto lleg\xF3 y la app calcula la tasa a la que cambiaste.","Una transferencia es mover dinero entre TUS cuentas (por ejemplo, de tu banco a Revolut). No es gasto ni ingreso, as\xED que tu patrimonio no cambia. Si las monedas son distintas, escribes cu\xE1nto lleg\xF3 y la app calcula el cambio.","Una transferencia es mover dinero entre TUS cuentas (por ejemplo, de tu checking a tu savings). No es gasto ni ingreso, as\xED que tu patrimonio no cambia.","Una transferencia es mover dinero entre TUS cuentas (por ejemplo, de tu banco a Wise). No es gasto ni ingreso, as\xED que tu patrimonio no cambia. Si las monedas son distintas, escribes cu\xE1nto lleg\xF3 y la app calcula el cambio.")]},{q:"El saldo de la app no coincide con el de mi banco",a:['Entra a la cuenta y revisa si falta algo por anotar (una comisi\xF3n, un pago peque\xF1o). Si a\xFAn hay diferencia, toca "Ajustar" y escribe el saldo real: la app registra la diferencia como "Ajuste de saldo". Hacerlo una vez por semana mantiene todo exacto.']},{q:"\xBFPuedo borrar una cuenta que ya no uso?",a:['Mejor arch\xEDvala: entra a la cuenta, toca editar y "Archivar". Desaparece de la lista y del total, pero su historial se conserva. Si te arrepientes, la restauras desde el mismo lugar.']},{q:"Me mud\xE9 de pa\xEDs, \xBFqu\xE9 hago?",a:[w("Cambia tu pa\xEDs en Ajustes \u203A Regi\xF3n y moneda. La app se adapta a las monedas, bancos y categor\xEDas del nuevo pa\xEDs, y tu moneda principal pasa a la de all\xE1. Tus cuentas y movimientos no cambian.","Cambia tu pa\xEDs en Ajustes \u203A Regi\xF3n y moneda. La app se adapta a las monedas, bancos y categor\xEDas del nuevo pa\xEDs. Tus cuentas y movimientos no cambian.","Cambia tu pa\xEDs en Ajustes \u203A Regi\xF3n y moneda. La app se adapta a las monedas, bancos y categor\xEDas del nuevo pa\xEDs. Tus cuentas y movimientos no cambian.","Cambia tu pa\xEDs en Ajustes \u203A Regi\xF3n y moneda. La app se adapta a las monedas, bancos y categor\xEDas del nuevo pa\xEDs, y tu moneda principal pasa a la de all\xE1. Tus cuentas y movimientos no cambian.")]}]},{id:"tasas",emoji:"\u{1F4B1}",title:"Tasas y brecha cambiaria",only:"rates",items:[{q:"\xBFDe d\xF3nde salen las tasas?",a:["El d\xF3lar BCV, el euro BCV y el d\xF3lar Paralelo (promedio Monitor) vienen de DolarApi. El USDT es la mediana de los 10 primeros anuncios de venta en Binance P2P.","Son de referencia: la tasa que te d\xE9 un comercio, tu banco o un cambista puede variar un poco."]},{q:"\xBFCada cu\xE1nto se actualizan?",a:["Solas, cuatro veces al d\xEDa: 8:00 a. m., 11:00 a. m., 2:00 p. m. y 6:00 p. m., hora de Venezuela. Si abres la app y todav\xEDa no hay tasas de hoy, las pide en ese momento. En Tasas tambi\xE9n puedes tocar el bot\xF3n de actualizar."]},{q:"\xBFQu\xE9 es la brecha?",a:["Es cu\xE1nto m\xE1s caro est\xE1 el d\xF3lar del mercado (Paralelo) que el oficial (BCV), en porcentaje. Importa cuando pagas en bol\xEDvares teniendo tu dinero en d\xF3lares o USDT: seg\xFAn la tasa a la que cambies, ese pago te sale m\xE1s barato o m\xE1s caro en d\xF3lares reales."]},{q:"Pagu\xE9 en bol\xEDvares desde mi cuenta en d\xF3lares, \xBFc\xF3mo lo anoto?",a:['Al registrar el gasto, elige la cuenta en d\xF3lares o USDT y activa "Pagu\xE9 en bol\xEDvares". Escribe los Bs. que pagaste y la tasa que usaste: la app calcula el costo real en tu moneda y te dice cu\xE1nto ahorraste o perdiste frente a la tasa BCV. En An\xE1lisis ves el total del mes.']},{q:"\xBFPuedo ver c\xF3mo se ha movido el d\xF3lar?",a:["S\xED. En Tasas \u203A Historial eliges una tasa y ves su evoluci\xF3n en el \xFAltimo mes, 3 meses, 6 meses o el a\xF1o, con su m\xEDnimo, su m\xE1ximo y cu\xE1nto subi\xF3. Toca la l\xEDnea para leer el valor de cada d\xEDa."]},{q:"Vivo fuera de Venezuela, \xBFpor qu\xE9 veo tasas?",only:["INT"],a:["Porque tienes al menos una cuenta activa en bol\xEDvares. Si la archivas, las tasas y la calculadora de brecha dejan de aparecer."]}]},{id:"respaldo",emoji:"\u{1F4BE}",title:"Respaldo y tus datos",items:[{q:"Si pierdo o cambio de tel\xE9fono, \xBFpierdo mis datos?",a:["No. Todo est\xE1 guardado en tu cuenta. Instala la app en el tel\xE9fono nuevo, entra con tu usuario y contrase\xF1a y aparece todo como lo dejaste."]},{q:"\xBFC\xF3mo descargo una copia de todo?",a:['En Ajustes \u203A Respaldo \u203A "Descargar todos mis datos (Excel)". Trae resumen, cuentas, movimientos, presupuestos, pagos fijos, metas, pr\xE9stamos y tasas, con colores y filtros listos para Excel, Numbers o Google Sheets.',Q("investments","Tambi\xE9n trae una hoja con tus inversiones."),'En iPhone, cuando aparezca el men\xFA de compartir, toca "Guardar en Archivos". Si pasan 7 d\xEDas sin respaldo, la app te lo recuerda.']},{q:"\xBFPuedo volver a cargar ese Excel en la app?",a:["No, la app no importa archivos. El Excel es tu copia para consultar, imprimir o guardar en un lugar seguro. Tus datos no dependen de \xE9l: ya est\xE1n guardados en tu cuenta."]},{q:"\xBFPuedo exportar solo algunos movimientos?",a:["S\xED. En Movimientos filtra por mes, cuenta o categor\xEDa y toca el \xEDcono de descarga. En An\xE1lisis, el mismo \xEDcono exporta el mes que est\xE1s viendo. En M\xE1s tambi\xE9n puedes exportarlo todo en Excel o en CSV (texto simple)."]}]},{id:"ia",emoji:"\u2728",title:"Copiloto IA (Fructosa)",items:[{q:"\xBFQu\xE9 hace Fructosa?",a:['Es tu asistente con inteligencia artificial. Registra movimientos a partir de lo que escribes, de una nota de voz o de la captura de un comprobante, y responde preguntas sobre tus finanzas, como "\xBFen qu\xE9 gast\xE9 m\xE1s este mes?".']},{q:"\xBFTengo que pagar o poner alguna clave?",a:["No. El Copiloto ya viene incluido y funciona sin configurar nada. Si prefieres usar tu propia clave de Google Gemini, la pegas en Ajustes \u203A Copiloto IA; se guarda solo en ese dispositivo."]},{q:"\xBFQu\xE9 datos ve la IA?",a:[w("Para responderte, se env\xEDa a Google Gemini tu pregunta, las capturas que adjuntes y un resumen de tus cuentas, tasas y \xFAltimos movimientos. La primera vez te pide permiso.","Para responderte, se env\xEDa a Google Gemini tu pregunta, las capturas que adjuntes y un resumen de tus cuentas y \xFAltimos movimientos. La primera vez te pide permiso.","Para responderte, se env\xEDa a Google Gemini tu pregunta, las capturas que adjuntes y un resumen de tus cuentas y \xFAltimos movimientos. La primera vez te pide permiso.","Para responderte, se env\xEDa a Google Gemini tu pregunta, las capturas que adjuntes y un resumen de tus cuentas y \xFAltimos movimientos. La primera vez te pide permiso."),w("En la versi\xF3n gratuita de Gemini, Google puede conservar esas conversaciones para mejorar sus servicios, as\xED que nunca le escribas contrase\xF1as ni claves. Fructosa tampoco repite n\xFAmeros de cuenta, c\xE9dulas ni tel\xE9fonos que aparezcan en una imagen.","En la versi\xF3n gratuita de Gemini, Google puede conservar esas conversaciones para mejorar sus servicios, as\xED que nunca le escribas contrase\xF1as ni claves. Fructosa tampoco repite n\xFAmeros de cuenta, tel\xE9fonos ni n\xFAmeros de referencia completos que aparezcan en una imagen.","En la versi\xF3n gratuita de Gemini, Google puede conservar esas conversaciones para mejorar sus servicios, as\xED que nunca le escribas contrase\xF1as ni claves. Fructosa tampoco repite n\xFAmeros de cuenta, tel\xE9fonos ni n\xFAmeros de referencia completos que aparezcan en una imagen.","En la versi\xF3n gratuita de Gemini, Google puede conservar esas conversaciones para mejorar sus servicios, as\xED que nunca le escribas contrase\xF1as ni claves. Fructosa tampoco repite n\xFAmeros de cuenta, tel\xE9fonos ni n\xFAmeros de referencia completos que aparezcan en una imagen.")]},{q:"\xBFPuede guardar un movimiento sin que yo lo apruebe?",a:['No. Fructosa te muestra el movimiento listo y nada se guarda hasta que tocas "Registrar". Revisa siempre el monto y la cuenta: la IA se puede equivocar.']},{q:'Me dice "Has hecho demasiadas preguntas seguidas"',a:["Para que la IA incluida alcance para toda la familia, cada persona tiene hasta 50 preguntas cada 10 minutos. Espera unos minutos y vuelve a intentarlo."]},{q:"\xBFSe guarda mi conversaci\xF3n?",a:['S\xED, en tu cuenta, para que la retomes desde cualquier dispositivo. Solo t\xFA la ves. La borras con "Nueva conversaci\xF3n".']},{q:"La nota de voz no funciona",a:['El navegador tiene que tener permiso para usar el micr\xF3fono. Cuando lo pida, toca "Permitir". Si lo negaste antes, act\xEDvalo en los ajustes del navegador o del tel\xE9fono para este sitio.']}]},{id:"app",emoji:"\u{1F4F1}",title:"Instalar, actualizar y usar sin internet",items:[{q:"\xBFLa descargo de la App Store o de Google Play?",a:['No hace falta. La Fructosa se instala desde el navegador y queda en tu pantalla de inicio como cualquier app, a pantalla completa. En iPhone: \xE1brela en Safari, toca Compartir y "Agregar a la pantalla de inicio". En Android: \xE1brela en Chrome y toca "Instalar". Los pasos completos est\xE1n en el Manual de uso.']},{q:"\xBFC\xF3mo se actualiza?",a:['Sola. Cuando hay una versi\xF3n nueva, arriba aparece "Hay una versi\xF3n nueva de La Fructosa": toca "Actualizar" y listo. No pierdes nada.']},{q:"\xBFFunciona sin internet?",a:['S\xED. Sin se\xF1al, la app abre con lo \xFAltimo que carg\xF3 y puedes seguir anotando. Ver\xE1s "\u23F3 movimientos por subir" y se suben solos cuando vuelve la conexi\xF3n, sin duplicarse. Lo que s\xED necesita internet: el Copiloto IA, subir fotos de comprobantes y traer datos nuevos.']},{q:"\xBFMe puede avisar cuando vence un pago?",a:["S\xED. En Ajustes \u203A Avisos activas recordatorios de pagos fijos, pr\xE9stamos y respaldo. Llegan a las 8:30 a. m. En iPhone, primero instala la app en la pantalla de inicio y \xE1brela desde ah\xED."]},{q:"\xBFPuedo ponerla en modo claro?",a:["S\xED. En Ajustes \u203A Apariencia eliges Oscuro, Claro o Autom\xE1tico (sigue el modo de tu tel\xE9fono)."]},{q:"Quiero ver el tour otra vez",a:['En M\xE1s \u203A Manual de uso toca "Ver el tour otra vez".']}]},{id:"inversiones",emoji:"\u{1F4C8}",title:"Inversiones",only:"investments",items:[{q:"\xBFQu\xE9 puedo registrar en Inversiones?",a:["Acciones, fondos, cripto, plazos fijos u otras. De cada una guardas el tipo, el monto invertido, la moneda, el valor actual, la fecha y una nota opcional."]},{q:"\xBFEl valor actual se actualiza solo?",a:["No. T\xFA lo escribes: abre la inversi\xF3n y cambia el valor actual cuando revises tu broker o tu exchange. La app recalcula la ganancia al momento."]},{q:"\xBFC\xF3mo se calcula la ganancia o p\xE9rdida?",a:["Valor actual menos monto invertido, en dinero y en porcentaje. La ves por inversi\xF3n, por tipo y en total, convertida a tu moneda principal."]},{q:"\xBFLas inversiones mueven dinero de mis cuentas?",a:["No. Son un registro aparte: no restan de ninguna cuenta. Su valor actual s\xED suma a tu patrimonio total del Inicio."]},{q:"\xBFQui\xE9n m\xE1s ve esta secci\xF3n?",a:["Nadie. Inversiones solo aparece en las cuentas que tienen el permiso activado en el servidor, y la app no puede encenderlo ni apagarlo. Adem\xE1s, cada quien ve solo sus propias inversiones. El Copiloto y el respaldo en Excel las incluyen solo para ti."]}]}];function ne(a,o={}){var e,t;return a?a==="rates"?!!((e=o.region)!=null&&e.rates):a==="investments"?o.investmentsOn===!0:Array.isArray(a)&&a.includes((t=o.region)==null?void 0:t.code):!0}function ie(a,o){var e;if(a&&a.__when)return ne(a.only,o)?ie(a.text,o):null;if(a&&a.__v){let t=((e=o.region)==null?void 0:e.code)||"VE";return t in a?a[t]:a.VE}return a}function qe(a={}){return He.filter(o=>ne(o.only,a)).map(o=>({...o,items:o.items.filter(e=>ne(e.only,a)).map(e=>({q:ie(e.q,a),a:e.a.map(t=>ie(t,a)).filter(t=>t!=null)})).filter(e=>e.q&&e.a.length)})).filter(o=>o.items.length)}var y=(a,o,e,t=a)=>({__v:!0,VE:a,ES:o,US:e,I
